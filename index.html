<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1b33">
<meta name="description" content="ARKA — Arsitektur Rekam Kinerja dan Administrasi DPRD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="arka-icon.svg" type="image/svg+xml">
<title>ARKA – Arsitektur Rekam Kinerja dan Administrasi DPRD</title>
<style>
:root{--bg:#f3f5f9;--surface:#fff;--ink:#1b2535;--muted:#667085;--line:#e3e7ee;--brand:#1d4ed8;--brand2:#0ea5e9;--ok:#12b76a;--warn:#f79009;--bad:#f04438;--side:#0f1b33;--sideTxt:#c3cde2;--r:14px;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06)}
html.dark{--bg:#0b1220;--surface:#131d30;--ink:#e6ecf7;--muted:#8b97ad;--line:#23304a;--side:#070d1a;--sideTxt:#8b97ad;--sh:none}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
#palbtn{display:none}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;transition:.15s}
button:hover{border-color:var(--brand)}
.btn-p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-d{color:var(--bad)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
/* sidebar */
aside{width:250px;background:var(--side);color:var(--sideTxt);position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .2s;flex-shrink:0;z-index:20}
aside .brand{padding:18px;color:#fff;font-weight:800;letter-spacing:.5px;display:flex;gap:10px;align-items:center}
aside .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:16px}
aside h6{margin:14px 18px 4px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55}
aside a{display:block;padding:7px 18px;color:var(--sideTxt);text-decoration:none;border-left:3px solid transparent;font-size:13px}
aside a:hover{background:rgba(255,255,255,.05)}
aside a.on{color:#fff;border-left-color:var(--brand2);background:rgba(14,165,233,.12)}
body.collapsed aside{width:64px}
body.collapsed aside .lbl,body.collapsed aside h6{display:none}
body.collapsed aside a{padding:9px 0;text-align:center;font-size:0}
body.collapsed aside a::first-letter{font-size:13px}
/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 16px}
header .search{flex:1;max-width:460px;position:relative}
header .search input{padding-left:34px}
header .search::before{content:"⌕";position:absolute;left:11px;top:6px;font-size:18px;color:var(--muted)}
.notif{position:relative}
.notif .pop{display:none;position:absolute;right:0;top:44px;width:340px;max-height:420px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:8px;z-index:30}
.notif.open .pop{display:block}
.pop .it{padding:8px;border-bottom:1px solid var(--line);font-size:12.5px}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 6px;margin-left:4px}
.content{padding:20px;display:grid;gap:18px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .n{font-size:26px;font-weight:800}
.kpi .t{color:var(--muted);font-size:12px}
.kpi .d{font-size:11.5px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}aside{position:fixed;left:-260px;transition:left .2s}body.mob.open aside{left:0}}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rowbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:12.5px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input{max-width:260px}
.toolbar select{max-width:170px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);position:sticky;top:0}
tr:hover td{background:rgba(29,78,216,.04)}
.pill{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--line)}
.s-Selesai,.s-Aktif,.s-Tercapai{background:rgba(18,183,106,.16);color:var(--ok)}
.s-Berjalan,.s-Proses{background:rgba(14,165,233,.16);color:var(--brand2)}
.s-Draft,.s-Tertunda{background:rgba(247,144,9,.18);color:var(--warn)}
.s-Terlambat{background:rgba(240,68,56,.16);color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.tnode{margin-left:20px;border-left:2px dashed var(--line);padding-left:12px}
details>summary{list-style:none;cursor:pointer;padding:6px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▾";display:inline-block;width:16px;color:var(--muted)}
details:not([open])>summary::before{content:"▸"}
.tn{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 8px;border-radius:8px;border:1px solid transparent}
.tn:hover{border-color:var(--brand);background:rgba(29,78,216,.06)}
.ng{margin-bottom:2px}
.gh{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-radius:0;color:var(--sideTxt);font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;padding:11px 18px 6px;text-align:left}
.gh:hover{color:#fff;border:0}
.gh .car{opacity:.6;font-size:11px}
.gi a{padding-left:24px}
#navq{margin:12px 14px 4px;width:calc(100% - 28px);background:rgba(255,255,255,.08);border-color:transparent;color:#fff}
#navq::placeholder{color:var(--sideTxt);opacity:.7}
body.collapsed .gh{display:none}
body.collapsed #navq{display:none}
/* modal, palette */
.ov{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.modal{background:var(--surface);border-radius:var(--r);width:min(640px,100%);max-height:90vh;overflow:auto;padding:18px;box-shadow:var(--sh)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.pal{width:min(560px,100%);align-self:flex-start;margin-top:12vh;padding:10px}
.pal .opt{padding:9px 10px;border-radius:10px;cursor:pointer}
.pal .opt:hover,.pal .opt.act{background:rgba(29,78,216,.1)}
.hint{font-size:11px;color:var(--muted)}
@media(max-width:700px){.form{grid-template-columns:1fr}.toolbar input,.toolbar select{max-width:none;flex:1}header .search{display:none}#palbtn{display:inline-block}}
@media print{aside,header,.toolbar,.noprint,.actions{display:none!important}main{width:100%}.content{padding:0}body{background:#fff;color:#000}.card,.tbl{border:none;box-shadow:none}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">⚖</div><div class="lbl">ARKA<div style="font-size:10px;font-weight:400;opacity:.7">Sekretariat DPRD</div></div></div>
  <input id="navq" placeholder="Cari menu…" autocomplete="off"><div id="nav"></div>
</aside>
<main>
  <header>
    <button id="tog" title="Menu">☰</button>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="ov" id="login"><form class="modal" id="lform" style="width:min(380px,100%)">
  <div style="text-align:center;margin-bottom:14px">
    <div class="logo" style="display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:20px">⚖</div>
    <h1 style="font-size:18px;margin-top:8px">ARKA</h1>
    <div class="sub">Arsitektur Rekam Kinerja dan Administrasi DPRD</div>
  </div>
  <label class="hint">Email<input id="lemail" type="email" required autocomplete="username"></label>

  <div id="lerr" style="color:var(--bad);font-size:12.5px;min-height:18px;margin-top:6px"></div>
  <button class="btn-p" id="lbtn" type="submit" style="width:100%;margin-top:8px">Masuk</button>
  <button id="cfgFromLogin" type="button" style="width:100%;margin-top:8px">⚙ Konfigurasi koneksi Supabase</button>
</form></div>
<div class="ov" id="pal"><div class="modal pal" id="palbox"><input id="palq" placeholder="Ketik nama menu atau perintah…"><div id="palList" style="margin-top:8px"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Versi aplikasi dipakai pada laporan Pemeriksaan Sistem dan Daftar Uji. */
const ARKA_APP_VERSION = '21.0.0';
const ARKA_BUILD_DATE = '2026-10-23';
/* ===== KONFIGURASI SUPABASE =====
   Konfigurasi dapat diisi dari tombol ⚙ pada antarmuka dan disimpan pada browser.
   Hanya URL proyek, anon/publishable key, dan slug Edge Function yang boleh berada di browser.
   JANGAN pernah memasukkan service_role / secret key ke file HTML. */
const ARKA_CONFIG_STORAGE_KEY = 'arka_supabase_config_v1';
function arkaReadConfig() {
  try { const value = JSON.parse(localStorage.getItem(ARKA_CONFIG_STORAGE_KEY) || '{}'); return value && typeof value === 'object' ? value : {}; }
  catch (_) { return {}; }
}
const ARKA_RUNTIME_CONFIG = arkaReadConfig();
const SUPABASE_URL = String(ARKA_RUNTIME_CONFIG.url || 'https://gsmhrhgc1zluelorarr.supabase.co').trim().replace(/\/+$/, '');
const SUPABASE_ANON_KEY = String(ARKA_RUNTIME_CONFIG.anonKey || '').trim();
/* Tangkapan layar Supabase memperlihatkan endpoint /functions/v1/quick-task.
   Slug bisa diubah dari menu konfigurasi tanpa mengubah nama fungsi di kode. */
const SUPABASE_USERS_FUNCTION = String(ARKA_RUNTIME_CONFIG.functionSlug || 'quick-task').trim();
const CLOUD = !!(SUPABASE_URL && SUPABASE_ANON_KEY && typeof supabase !== 'undefined');
let ARKA_ROLE = null, ARKA_NAMA = '', ARKA_UNIT = null;
/* Unit kerja sesuai Perbup Kapuas Hulu Nomor 57 Tahun 2021, Pasal 5 dan Lampiran */
const UNITS = {
  umum_keuangan: 'Bagian Umum dan Keuangan',
  persidangan: 'Bagian Persidangan dan Perundang-undangan',
  fasilitasi: 'Bagian Fasilitasi Penganggaran dan Pengawasan'
};
/* Unit yang mengelola (menulis) setiap modul. Dasar pasal: lihat KAMUS_DATA.md */
const UNIT_MODUL = {
  pegawai:'umum_keuangan', anggota:'umum_keuangan', komisi:'persidangan', fraksi:'umum_keuangan', alat:'persidangan', 'keanggotaan-akd':'persidangan', tenaga:'umum_keuangan', mitra:'fasilitasi',
  program:'umum_keuangan', kegiatan:'umum_keuangan', subkegiatan:'umum_keuangan', sasaran:'umum_keuangan', iku:'umum_keuangan', iki:'umum_keuangan', regulasi:'persidangan',
  rpjmd:'umum_keuangan', renstra:'umum_keuangan', renja:'umum_keuangan', cascading:'umum_keuangan', pohon:'umum_keuangan', perjanjian:'umum_keuangan', rencanaaksi:'umum_keuangan', ikuk:'umum_keuangan', ikik:'umum_keuangan', monitoring:'umum_keuangan', evaluasi:'umum_keuangan',
  persuratan:'umum_keuangan', arsip:'umum_keuangan', perjalanan:'umum_keuangan', kepegawaian:'umum_keuangan', rumahtangga:'umum_keuangan', kendaraan:'umum_keuangan', anggaran:'umum_keuangan', spj:'umum_keuangan',
  'aset-rencana':'umum_keuangan', inventaris:'umum_keuangan', pemeliharaan:'umum_keuangan', mutasi:'umum_keuangan', penghapusan:'umum_keuangan', rekonsiliasi:'umum_keuangan',
  agenda:'persidangan', jadwal:'persidangan', rapat:'persidangan', 'rapat-komisi':'persidangan', banggar:'fasilitasi', bapemperda:'persidangan', bk:'fasilitasi', paripurna:'persidangan', risalah:'persidangan', notulen:'persidangan', keputusan:'persidangan',
  propemperda:'persidangan', ranperda:'persidangan', naskahakademik:'persidangan', dim:'persidangan', harmonisasi:'persidangan', jdih:'persidangan',
  kua:'fasilitasi', ppas:'fasilitasi', apbd:'fasilitasi', apbdp:'fasilitasi', lapsemester:'fasilitasi', pertanggungjawaban:'fasilitasi',
  monopd:'fasilitasi', monprogram:'fasilitasi', monproyek:'fasilitasi', lkpj:'fasilitasi', temuan:'fasilitasi', rekomendasi:'fasilitasi', tindaklanjut:'fasilitasi',
  reses:'fasilitasi', pokir:'fasilitasi', hearing:'persidangan', audiensi:'persidangan', aspirasidigital:'fasilitasi', pengaduan:'umum_keuangan',
  berita:'persidangan', publikasi:'persidangan', dokumentasi:'persidangan', mediamon:'persidangan', protokoler:'persidangan'
};
/* Modul yang hanya bisa dibaca unit tertentu (selain pengelolanya tidak dapat membaca) */
const BACA_KHUSUS = { bk: ['fasilitasi'], pengaduan: ['umum_keuangan'] };
/* Admin: semua. Pimpinan (Sekretaris Dewan): baca semua. Pengelola: baca semua (kecuali BACA_KHUSUS), tulis hanya modul unitnya. */
const canWrite = t => !CLOUD || ARKA_ROLE === 'admin' || (ARKA_ROLE === 'pengelola' && UNIT_MODUL[t] === ARKA_UNIT);
const canRead  = t => !CLOUD || ['admin','pimpinan'].includes(ARKA_ROLE) || (ARKA_ROLE === 'pengelola' && (!BACA_KHUSUS[t] || BACA_KHUSUS[t].includes(ARKA_UNIT)));
const canDelete = () => !CLOUD || ARKA_ROLE === 'admin';
/* Hapus khusus untuk master Komisi/Fraksi dapat dilakukan pengelola unit pemilik modul.
   Modul lain tetap mengikuti kebijakan hapus admin. */
const canDeleteRecord = t => canDelete() || (['komisi','fraksi'].includes(t) && canWrite(t));

/* ============ DATA LAYER (siap migrasi Supabase: ganti fungsi db*) ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('id-ID');
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const TABLES={};          // { modul: [rows] }
const AUDIT=[];           // jejak audit
function dbAll(t){return TABLES[t]||[]}
function ratioPct(n,d){
  if(n===null||n===undefined||n===''||d===null||d===undefined||d==='')return null;
  const numerator=Number(n), denominator=Number(d);
  if(!Number.isFinite(numerator)||!Number.isFinite(denominator)||denominator<=0)return null;
  return numerator/denominator*100;
}
function fmtPct(v,digits=1){return v===null?'—':`${v.toFixed(digits)}%`}
function dbSave(t,row){
  if(!canWrite(t)){toast('Peran Anda tidak dapat mengubah data modul ini');return Promise.reject(new Error('Akses tulis ditolak oleh aplikasi.'))}
  if(CLOUD && !navigator.onLine){return Promise.reject(new Error('Perangkat sedang offline. Data cloud tidak disimpan; sambungkan jaringan lalu coba kembali.'))}
  const isNew=!row.id; if(isNew){row.id=uid();row.dibuat=today()}
  row.diubah=today();
  const commit=()=>{
    const list=TABLES[t]=TABLES[t]||[];
    const i=list.findIndex(r=>r.id===row.id);
    if(i>=0)list[i]=row; else list.push(row);
    if(['anggota','komisi','fraksi'].includes(t))resolveRefs();
    logAudit(isNew?'TAMBAH':'UBAH',t,row);
    return row;
  };
  if(!CLOUD)return Promise.resolve(commit());
  return arkaWrite(t,row,isNew).then(()=>commit()).catch(async e=>{
    if(e.dataCommitted){
      try{await arkaLoad()}catch(_){}
      logAudit(isNew?'TAMBAH':'UBAH',t,row);
      toast('Data tersimpan di database, tetapi audit trail gagal. Jangan ulangi input; admin harus memeriksa audit_log.');
      const partial=new Error(e.message); partial.dataCommitted=true; throw partial;
    }
    try{await arkaLoad()}catch(_){}
    throw e;
  });
}
function logAudit(aksi,t,row,userOverride){
  AUDIT.unshift({waktu:new Date().toLocaleString('id-ID'),aksi,modul:t,ref:row.nama||row.kode||row.id,user:userOverride||ARKA_NAMA||(CLOUD?'Pengguna terautentikasi':'Pengguna lokal')});
  if(AUDIT.length>200)AUDIT.pop();
  renderNotif();
}

/* ============ KONFIGURASI MENU ============ */
const MENU=[
 {g:'Dashboard',items:[['dash','Dashboard Eksekutif'],['panduan','Panduan Input'],['periksa','Pemeriksaan Sistem'],['uji','Daftar Uji'],['pengguna','Pengguna & Hak Akses']]},
 {g:'Master Data',items:[['pegawai','Pegawai'],['anggota','Anggota DPRD'],['komisi','Komisi'],['fraksi','Fraksi'],['alat','Alat Kelengkapan DPRD'],['keanggotaan-akd','Keanggotaan AKD'],['tenaga','Tenaga Ahli'],['mitra','Mitra Kerja'],['program','Program'],['kegiatan','Kegiatan'],['subkegiatan','Sub Kegiatan'],['sasaran','Sasaran'],['iku','IKU'],['iki','IKI'],['regulasi','Regulasi']]},
 {g:'Renstra & Kinerja',items:[['rpjmd','RPJMD'],['renstra','Renstra'],['renja','Renja'],['cascading','Cascading'],['pohon','Pohon Kinerja'],['perjanjian','Perjanjian Kinerja'],['rencanaaksi','Rencana Aksi'],['ikuk','IKU (Kinerja)'],['ikik','IKI (Kinerja)'],['monitoring','Monitoring'],['evaluasi','Evaluasi']]},
 {g:'Umum & Keuangan',items:[['persuratan','Persuratan'],['arsip','Arsip'],['perjalanan','Perjalanan Dinas'],['kepegawaian','Kepegawaian'],['rumahtangga','Rumah Tangga'],['kendaraan','Kendaraan'],['anggaran','Anggaran'],['spj','SPJ']]},
 {g:'Aset & BMD',items:[['aset-rencana','Perencanaan'],['inventaris','Inventaris'],['pemeliharaan','Pemeliharaan'],['mutasi','Mutasi'],['penghapusan','Penghapusan'],['rekonsiliasi','Rekonsiliasi']]},
 {g:'Persidangan DPRD',items:[['agenda','Agenda'],['jadwal','Jadwal'],['rapat','Rapat'],['rapat-komisi','Komisi'],['banggar','Badan Anggaran'],['bapemperda','Bapemperda'],['bk','Badan Kehormatan'],['paripurna','Paripurna'],['risalah','Risalah'],['notulen','Notulen'],['keputusan','Keputusan']]},
 {g:'Legislasi',items:[['propemperda','Propemperda'],['ranperda','Ranperda'],['naskahakademik','Naskah Akademik'],['dim','DIM'],['harmonisasi','Harmonisasi'],['jdih','JDIH DPRD']]},
 {g:'Penganggaran DPRD',items:[['kua','KUA'],['ppas','PPAS'],['apbd','APBD'],['apbdp','APBDP'],['lapsemester','Laporan Semester'],['pertanggungjawaban','Pertanggungjawaban']]},
 {g:'Pengawasan DPRD',items:[['monopd','Monitoring OPD'],['monprogram','Monitoring Program'],['monproyek','Monitoring Proyek'],['lkpj','LKPJ'],['temuan','Temuan'],['rekomendasi','Rekomendasi'],['tindaklanjut','Tindak Lanjut']]},
 {g:'Aspirasi',items:[['reses','Reses'],['pokir','Pokir'],['hearing','Hearing'],['audiensi','Audiensi'],['aspirasidigital','Aspirasi Digital'],['pengaduan','Pengaduan']]},

}

/* ============ NAVIGASI ============ */
let NAVQ='';
const NAVST={};   // status buka/tutup grup yang diubah pengguna
function navIsOpen(gi,items,cur){
  if(document.body.classList.contains('collapsed')||NAVQ)return true;
  if(NAVST[gi]!==undefined)return NAVST[gi];
  return items.some(([id])=>id===cur);
}
function renderNav(){
  const cur=location.hash.slice(1)||'dash', q=NAVQ.trim().toLowerCase();
  $('#nav').innerHTML=MENU.map((g,gi)=>{
    const items=g.items.filter(([id,l])=>(!q||(l+' '+g.g).toLowerCase().includes(q))&&(!isDataMod(id)||canRead(id)));
    if(!items.length)return '';
    const open=navIsOpen(gi,items,cur);
    return `<div class="ng"><button class="gh" onclick="toggleG(${gi})"><span class="gt">${esc(g.g)}</span><span class="car">${open?'▾':'▸'}</span></button>`+
      (open?`<div class="gi">${items.map(([id,l])=>`<a href="#${id}" class="${id===cur?'on':''}" title="${esc(l)}"><span class="lbl">${esc(l)}</span></a>`).join('')}</div>`:'')+`</div>`;
  }).join('');
}
function toggleG(gi){
  const g=MENU[gi], cur=location.hash.slice(1)||'dash';
  const items=g.items.filter(([id,l])=>(!NAVQ||(l+' '+g.g).toLowerCase().includes(NAVQ.trim().toLowerCase()))&&(!isDataMod(id)||canRead(id)));
  NAVST[gi]=!navIsOpen(gi,items,cur);
  renderNav();
}
function go(){
  const id=location.hash.slice(1)||'dash';
  renderNav();
  if(id==='dash')return renderDash();
  if(id==='evidence')return renderEvidence();
  if(id==='panduan')return renderPanduan();
  if(id==='periksa')return renderPeriksa();
  if(id==='uji')return renderUji();
  if(id==='pengguna')return renderPengguna();
  if(id.startsWith('an-'))return renderAnalytics(id);
  renderModule(id);
}

const TREES={pohon:'Pohon Kinerja',cascading:'Cascading Sasaran'};
function buildTree(id){
  if(id==='pohon'){
    const all=dbAll('pohon');
    return{
      roots:all.filter(x=>!x.induk||!all.some(y=>y.id===x.induk)),
      kids:n=>all.filter(x=>x.induk===n.id),
      render:n=>`<span class="tn" onclick="event.preventDefault();event.stopPropagation();openForm('pohon','${n.id}')"><span class="pill s-${esc(n.status)}">${esc(n.level)}</span><b>${esc(n.kode)}</b>&nbsp;${esc(n.nama)}</span>`
    };
  }
  const cas=dbAll('cascading'), sas=dbAll('sasaran');
  const src=new Set(cas.map(c=>c.sumber)), tgt=new Set(cas.map(c=>c.tujuan));
  return{
    roots:sas.filter(s=>src.has(s.id)&&!tgt.has(s.id)),
    kids:n=>cas.filter(c=>c.sumber===n.id).map(c=>sas.find(s=>s.id===c.tujuan)).filter(Boolean),
    render:n=>{
      const ik=dbAll('iku').find(x=>x.id===n.iku);
      return `<span class="tn" onclick="event.preventDefault();event.stopPropagation();openForm('sasaran','${n.id}')"><b>${esc(n.kode)}</b>&nbsp;${esc(n.nama)}${ik?` <span class="sub">· ${esc(ik.kode)}</span>`:''}</span>`;
    }
  };
}
function treeHTML(nodes,b,seen){
  return nodes.map(n=>{
    if(seen.has(n.id))return '';
    seen.add(n.id);
    return `<details open><summary>${b.render(n)}</summary><div class="tnode">${treeHTML(b.kids(n),b,seen)}</div></details>`;
  }).join('');
}
function renderTree(id){
  const b=buildTree(id), html=treeHTML(b.roots,b,new Set())||'<div class="empty">Belum ada hubungan induk–anak.</div>';
  const el=document.createElement('div');
  el.className='card';el.id='tree';
  el.innerHTML=`<div class="row"><b>Hierarki ${TREES[id]}</b><span class="noprint actions"><button onclick="setTree(true)">Buka semua</button> <button onclick="setTree(false)">Tutup semua</button></span></div><div style="margin-top:8px;overflow-x:auto">${html}</div>`;
  $('#view .row').insertAdjacentElement('afterend',el);
}
function setTree(o){$$('#tree details').forEach(d=>d.open=o)}
function filtered(id){
  const cols=FIELDS[id]||STD, q=S.q.toLowerCase();
  const rows = dbAll(id).filter(r=>(!S.st||r.status===S.st)&&(!q||cols.some(([k,,ty,opt])=>{
    let value=r[k]??'';
    if(ty==='rel'&&value){const target=dbAll(opt).find(x=>String(x.id)===String(value));if(target)value=[target.nama,target.kode].filter(Boolean).join(' ')}
    if(ty==='hit')value=exportFieldValue(id,r,cols.find(c=>c[0]===k)||[k,'',ty,opt]);
    if(ty==='turunan')value=turunanText(opt,r.id);
    return String(value).toLowerCase().includes(q);
  })));
  // Urutkan master Komisi dan Fraksi berdasarkan kode secara natural (K-1, K-2, K-10; F-01, F-02, ...).
  // Jangan bergantung pada urutan baris yang dikembalikan database karena SELECT tanpa ORDER BY tidak menjamin urutan.
  if(id==='komisi'||id==='fraksi'){
    rows.sort((a,b)=>String(a.kode||'').localeCompare(String(b.kode||''),'id',{numeric:true,sensitivity:'base'}) || String(a.nama||'').localeCompare(String(b.nama||''),'id',{numeric:true,sensitivity:'base'}));
  }
  return rows;
}
const TABLE_COLS={anggota:8,alat:7,'keanggotaan-akd':6}; // Kolom jabatan Anggota DPRD dan seluruh kolom AKD ditampilkan.
function drawTable(id){
  const allCols=FIELDS[id]||STD;

  const tableCols=id==='anggota'

  const cols=tableCols.slice(0,TABLE_COLS[id]||5);

  ${rows.map((r,i)=>`<tr><td>${i+1}</td>${cols.map(c=>`<td>${cellVal(r,c)}</td>`).join('')}
  <td class="noprint actions">${canWrite(id)?`<button onclick="openForm('${id}','${r.id}')">Ubah</button>`:''} ${canDeleteRecord(id)?`<button type="button" class="btn-d" title="Hapus ${id==='komisi'?'Komisi':id==='fraksi'?'Fraksi':'record'} ini" onclick="delRow('${id}','${r.id}')">${id==='komisi'?'Hapus Komisi':id==='fraksi'?'Hapus Fraksi':'Hapus'}</button>`:''}</td></tr>`).join('')}
  </tbody></table>`:`<div class="empty">Tidak ada data yang cocok.</div>`;
  if(id==='komisi'||id==='fraksi')renderMemberSource(id);
  if(!window._sr)window._sr=0;
}
function canManageMembership(groupType){

  return ['komisi','fraksi'].includes(groupType) && (canWrite('anggota') || canWrite(groupType));

function openMembershipPicker(groupType, groupId){
  if(!['komisi','fraksi'].includes(groupType)){toast('Modul kelompok tidak valid');return}
  if(!canManageMembership(groupType)){toast('Anda tidak memiliki hak untuk mengubah penempatan anggota');return}
  const group=dbAll(groupType).find(g=>String(g.id)===String(groupId));
  if(!group){toast('Data kelompok tidak ditemukan');return}
  const isKomisi=groupType==='komisi';
  const field=isKomisi?'komisi':'fraksi';
  const roleField=isKomisi?'peranKomisi':'peranFraksi';
  const label=isKomisi?'Komisi':'Fraksi';
  const groupName=group.nama||group.kode||groupId;
  // Pilihan nama selalu berasal dari master Anggota DPRD. Record yang sudah terdaftar
  // pada kelompok yang sedang dibuka tidak ditawarkan lagi agar tidak terjadi duplikasi.
  const candidates=dbAll('anggota').filter(m=>String(m.nama||'').trim()&&String(m[field]||'')!==String(groupId));
  const options=candidates.map(m=>{
    const currentId=String(m[field]||'');
    const currentGroup=dbAll(groupType).find(g=>String(g.id)===currentId);
    const currentLabel=currentGroup?` · Saat ini: ${currentGroup.nama||currentGroup.kode||currentId}`:(currentId?` · Referensi saat ini tidak ditemukan`: ' · Belum ditempatkan');
    const meta=[m.dapil,m.status].filter(Boolean).join(' · ');
    return `<option value="${esc(m.id)}">${esc(m.nama)}${meta?' · '+esc(meta):''}${esc(currentLabel)}</option>`;
  }).join('');
  $('#modal').innerHTML=`<div class="row"><h1 style="font-size:17px">Tambah anggota ke ${esc(label)} · ${esc(groupName)}</h1><button type="button" onclick="closeM()">✕</button></div>
  <form class="form" style="margin-top:12px" id="memberPickerForm">
    <div class="full hint" style="padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)">Pilih nama dari kolom Nama pada modul Anggota DPRD. Formulir ini hanya menetapkan penempatan dan peran; tidak membuat ulang data anggota.</div>
    ${candidates.length?`<label class="full">Nama Anggota DPRD<select name="memberId" required><option value="">— pilih nama anggota —</option>${options}</select></label>`:`<div class="full empty">Tidak ada nama Anggota DPRD yang tersedia untuk ditambahkan. Periksa atau tambahkan data di modul Anggota DPRD terlebih dahulu.</div>`}
    <label class="full">Peran dalam ${esc(label)}<select name="role" required><option value="Anggota" selected>Anggota</option><option value="Ketua">Ketua</option><option value="Wakil Ketua">Wakil Ketua</option><option value="Sekretaris">Sekretaris</option></select></label>
    <div class="full" id="memberPickerError" style="display:none;color:var(--bad);padding:8px 10px;border:1px solid rgba(240,68,56,.35);background:rgba(240,68,56,.06);border-radius:8px"></div>
    <div class="full row" style="margin-top:6px"><span class="hint">Nama diambil dari data induk Anggota DPRD.</span><span><button type="button" onclick="closeM()">Batal</button> <button class="btn-p" type="submit" ${candidates.length?'':'disabled'}>Simpan penempatan</button></span></div>
  </form>`;
  $('#ov').classList.add('show');
  $('#memberPickerForm').onsubmit=async e=>{
    e.preventDefault();
    const fd=Object.fromEntries(new FormData(e.target));
    const member=dbAll('anggota').find(m=>String(m.id)===String(fd.memberId));
    const err=$('#memberPickerError');
    const showError=message=>{err.textContent=message;err.style.display='block'};
    if(!member){showError('Pilih nama anggota DPRD yang valid.');return}
    if(String(member[field]||'')===String(groupId)){showError(`${member.nama} sudah terdaftar pada ${label} ini.`);return}
    const candidateRow={...member,[field]:String(groupId),[roleField]:String(fd.role||'Anggota')};
    const validation=validateMembershipEdit('anggota',member.id,member,candidateRow);
    if(validation){showError(validation);return}
    const oldId=String(member[field]||'');
    if(oldId){
      const oldGroup=dbAll(groupType).find(g=>String(g.id)===oldId);
      const oldName=oldGroup?(oldGroup.nama||oldGroup.kode||oldId):`referensi ${oldId} yang tidak dikenal`;
      if(!confirm(`${member.nama} saat ini sudah ditempatkan pada ${label.toLowerCase()} "${oldName}".\n\nJika dilanjutkan, penempatan akan dipindahkan ke "${groupName}". Data induk anggota dan penempatan pada jenis kelompok lain tidak dihapus.\n\nLanjutkan?`))return;
    }
    const list=TABLES.anggota||[];
    const index=list.findIndex(m=>String(m.id)===String(member.id));
    if(index<0){showError('Data Anggota DPRD tidak ditemukan lagi. Muat ulang modul dan coba kembali.');return}
    const updated={...member,[field]:String(groupId),[roleField]:String(fd.role||'Anggota'),diubah:today()};
    const submit=e.target.querySelector('button[type="submit"]');
    if(submit)submit.disabled=true;
    try{
      if(CLOUD)await arkaWrite('anggota',updated,false,'TETAPKAN PENEMPATAN');
      list[index]=updated;
      resolveRefs();
      logAudit('TETAPKAN PENEMPATAN','anggota',updated);
      closeM();
      toast(`${member.nama} berhasil ditempatkan pada ${label} ${groupName}`);
      renderModule(groupType);
    }catch(error){
      if(submit)submit.disabled=false;
      const message=error?.message||String(error);
      showError(`Penempatan belum dapat dipastikan tersimpan: ${message}. Periksa izin Supabase, lalu muat ulang data sebelum mencoba kembali.`);
      if(CLOUD){try{await arkaLoad();}catch(_){} }
    }
  };
}

function updateMembershipAssignment(groupType, member, patch, successText){
  if(!canManageMembership(groupType)){toast('Anda tidak memiliki hak untuk mengubah penempatan pada modul ini');return false}
  const list=TABLES.anggota||[];
  const index=list.findIndex(x=>String(x.id)===String(member.id));
  if(index<0){toast('Data Anggota DPRD tidak ditemukan');return false}
  const updated={...list[index],...patch,diubah:today()};
  list[index]=updated;
  if(['anggota','komisi','fraksi'].includes(groupType))resolveRefs();
  logAudit('LEPAS PENEMPATAN','anggota',updated);
  if(CLOUD){
    arkaWrite('anggota',updated,false,'LEPAS PENEMPATAN').catch(e=>{
      toast('Perubahan belum tersimpan di server: '+e.message+'. Periksa kebijakan RLS Supabase untuk perubahan penempatan anggota.');
      arkaLoad().then(()=>go()).catch(loadError=>toast('Gagal memuat ulang data: '+loadError.message));
    });
  }
  toast(successText);
  renderModule(groupType);
  return true;
}
function removeMemberFromGroup(groupType,groupId,memberId){
  // Melepas penempatan dari daftar Fraksi/Komisi saja; record induk tetap tersimpan.
  if(!['komisi','fraksi'].includes(groupType)){toast('Jenis kelompok tidak valid');return}
  if(!canManageMembership(groupType)){toast('Anda tidak memiliki hak untuk mengubah penempatan pada modul ini');return}
  const isKomisi=groupType==='komisi';
  const field=isKomisi?'komisi':'fraksi';
  const roleField=isKomisi?'peranKomisi':'peranFraksi';
  const group=dbAll(groupType).find(g=>String(g.id)===String(groupId));
  const member=dbAll('anggota').find(m=>String(m.id)===String(memberId));
  if(!group||!member||String(member[field]||'')!==String(groupId)){toast('Penempatan anggota tidak ditemukan atau sudah berubah');renderModule(groupType);return}
  const groupLabel=isKomisi?'Komisi':'Fraksi';

}
function removeOrphanMembership(groupType,memberId){
  if(!['komisi','fraksi'].includes(groupType)||!canManageMembership(groupType)){toast('Anda tidak memiliki hak untuk mengubah penempatan pada modul ini');return}

function turunanDisplayName(opt,row){const src=opt&&opt[0];if(src==='keanggotaan-akd'){const m=dbAll('anggota').find(x=>String(x.id)===String(row.anggota||''));return m?(m.nama||''):'Anggota tidak terhubung'}return row.nama||''}

function resolveRefs(){
  // Data lama pernah menyimpan nama/kode relasi, sedangkan formulir sekarang memakai ID.
  // Normalisasi dilakukan setelah seluruh tabel selesai dimuat; nilai yang tidak cocok
  // dipertahankan agar bisa ditampilkan sebagai referensi yatim dan diperbaiki manual.
  Object.keys(FIELDS).forEach(t=>FIELDS[t].forEach(([k,,ty,opt])=>{
    if(ty!=='rel')return;
    (TABLES[t]||[]).forEach(r=>{
      const value=r[k];
      if(!value||dbAll(opt).some(x=>String(x.id)===String(value)))return;
      let matches=dbAll(opt).filter(x=>String(x.kode||'').trim().toLowerCase()===String(value).trim().toLowerCase()||String(x.nama||'').trim().toLowerCase()===String(value).trim().toLowerCase());
      if(matches.length!==1&&(k==='ketua'&&(t==='fraksi'||t==='komisi'))){
        const legacy=String(value).trim().toLowerCase();
        if(legacy.length>=4)matches=dbAll(opt).filter(x=>String(x.nama||'').trim().toLowerCase().startsWith(legacy));
      }
      if(matches.length===1)r[k]=matches[0].id;
    });
  }));
}
const PERAN_GRUP={fraksi:{field:'fraksi',peran:'peranFraksi'},komisi:{field:'komisi',peran:'peranKomisi'}};
function migrateLegacyKetua(){
  // Data lama menyimpan Ketua pada master Komisi/Fraksi. Peran Ketua Komisi/Fraksi
  // tetap bersumber dari Anggota DPRD; nilai legacy dihapus dari salinan memori.
  const pending=[];
  [['komisi','komisi','peranKomisi'],['fraksi','fraksi','peranFraksi']].forEach(([gt,field,peran])=>{
    dbAll(gt).forEach(g=>{
      const raw=String(g.ketua||'').trim(), legacy=raw.toLowerCase();
      if(!legacy){delete g.ketua;return}
      const m=dbAll('anggota').find(x=>String(x.id)===raw||String(x.nama||'').trim().toLowerCase()===legacy);
      const sudahAdaKetua=dbAll('anggota').some(x=>String(x[field]||'')===String(g.id)&&x[peran]==='Ketua'&&x.status!=='Nonaktif');
      if(m&&!sudahAdaKetua&&String(m[field]||'')===String(g.id)&&m.status!=='Nonaktif'&&m[peran]!=='Ketua'){m[peran]='Ketua';pending.push(m)}
      delete g.ketua;
    });
  });
  if(CLOUD)pending.forEach(m=>arkaWrite('anggota',m,false).catch(e=>toast('Gagal menyimpan migrasi Ketua: '+e.message)));

  // Migrasi kompatibilitas untuk data lama modul Alat Kelengkapan: nama Ketua yang
  // dulu diketik bebas dipindah menjadi relasi AKD–Anggota DPRD, tanpa mengarang anggota lain.
  dbAll('alat').forEach(g=>{
    const raw=String(g.ketua||'').trim();
    if(raw){
      const legacy=raw.toLowerCase();
      const m=dbAll('anggota').find(x=>String(x.id)===raw||String(x.nama||'').trim().toLowerCase()===legacy);
      if(m){
        const exists=dbAll('keanggotaan-akd').some(x=>String(x.alat)===String(g.id)&&String(x.anggota)===String(m.id));
        if(!exists){
          const assignment={id:uid(),dibuat:today(),diubah:today(),kode:`MIG-${g.kode||g.id}`,alat:String(g.id),anggota:String(m.id),peran:'Ketua',status:m.status==='Nonaktif'?'Nonaktif':'Aktif',keterangan:'Dipindahkan dari kolom Ketua lama; mohon verifikasi terhadap susunan resmi.'};
          const list=TABLES['keanggotaan-akd']=TABLES['keanggotaan-akd']||[];list.push(assignment);logAudit('MIGRASI RELASI','keanggotaan-akd',assignment);
          if(CLOUD)arkaWrite('keanggotaan-akd',assignment,true,'MIGRASI RELASI').catch(e=>toast('Gagal memindahkan Ketua lama pada '+(g.nama||g.kode)+': '+e.message));
        }
      }
    }
    delete g.ketua;
    delete g.jumlah;
  });
  migrateLegacyAKDTypes();
}
function migrateLegacyAKDTypes(){
  // Ubah label generik lama hanya jika nama record cukup jelas untuk pemetaan.
  // Pengelola yang read-only tidak melakukan migrasi database.
  if(CLOUD&&!canWrite('alat'))return;
  dbAll('alat').forEach(g=>{
    const jenis=String(g.jenis||'').trim().toLowerCase();
    const nama=String(g.nama||'').trim().toLowerCase();
    let mapped='';
    if(jenis==='badan'){
      if(nama.includes('musyawarah')||nama==='bamus')mapped='Badan Musyawarah';
      else if(nama.includes('anggaran')||nama==='banggar')mapped='Badan Anggaran';
      else if(nama.includes('pembentukan perda')||nama.includes('bapemperda'))mapped='Badan Pembentukan Perda';
      else if(nama.includes('kehormatan')||nama==='bk')mapped='Badan Kehormatan';
    }else if(jenis==='panitia'&&nama.includes('khusus'))mapped='Panitia Khusus';
    if(mapped&&mapped!==g.jenis){
      g.jenis=mapped;g.diubah=today();logAudit('MIGRASI JENIS AKD','alat',g);
      if(CLOUD)arkaWrite('alat',g,false,'MIGRASI JENIS AKD').catch(e=>toast('Gagal memperbarui jenis AKD '+(g.nama||g.kode)+': '+e.message));
    }
  });
}
function validateMembershipEdit(t,id,row,fd){
  // Hanya Anggota DPRD yang menetapkan keanggotaan dan Ketua. Modul Fraksi/Komisi tidak menyimpan pointer.
  if(t!=='anggota')return '';
  for(const [grup,{field,peran}] of Object.entries(PERAN_GRUP)){
    if(fd[peran]!=='Ketua')continue;
    const label=LABEL[grup];
    const groupId=String(fd[field]||'');
    if(!groupId)return `Peran Ketua ${label} hanya dapat diberikan setelah anggota ditempatkan pada ${label.toLowerCase()}.`;
    if(fd.status==='Nonaktif')return `Anggota Nonaktif tidak dapat menjabat sebagai Ketua ${label}.`;
    const other=dbAll('anggota').find(m=>String(m.id)!==String(id||'')&&String(m[field]||'')===groupId&&m[peran]==='Ketua'&&m.status!=='Nonaktif');
    if(other)return `${label} ini sudah memiliki Ketua: ${other.nama}. Ubah peran ${other.nama} menjadi Anggota terlebih dahulu.`;
  }
  return '';
}

function refsToRecords(t,id){
  // Ambil record yang benar-benar menunjuk ke master ini, termasuk modul selain Anggota DPRD.
  // Kelompokkan per record agar beberapa kolom relasi dalam record yang sama diperbarui sekaligus.
  const refs=new Map();
  DATA_MODS.forEach(t2=>(FIELDS[t2]||STD).forEach(c=>{
    if(c[2]!=='rel'||c[3]!==t)return;
    dbAll(t2).forEach(r=>{
      if(String(r[c[0]]??'')!==String(id)||(t2===t&&String(r.id)===String(id)))return;
      const key=String(t2)+'::'+String(r.id);
      if(!refs.has(key))refs.set(key,{module:t2,row:{...r},fields:[]});
      const entry=refs.get(key);
      if(!entry.fields.some(f=>f.key===c[0]))entry.fields.push({key:c[0],label:c[1]});
    });
  }));
  return [...refs.values()];
}
function describeReferences(refs){
  const summary=new Map();
  refs.forEach(ref=>ref.fields.forEach(field=>{
    const key=LABEL[ref.module]+' (kolom '+field.label+')';
    summary.set(key,(summary.get(key)||0)+1);
  }));
  return [...summary.entries()].map(([label,count])=>`${label} (${count} record)`).join('\n- ');
}
async function delRow(t,id){
  if(!canDeleteRecord(t)){toast('Peran Anda tidak memiliki hak untuk menghapus record ini');return}
  const row=dbAll(t).find(r=>String(r.id)===String(id));
  if(!row){toast('Record tidak ditemukan');return}
  const nama=String(row.nama||row.kode||id);
  const label=t==='komisi'?'Komisi':t==='fraksi'?'Fraksi':'record';
  const refs=refsToRecords(t,id);
  // Pertahankan aturan integritas utama: master Komisi/Fraksi tidak boleh dihapus
  // jika masih menjadi penempatan anggota; relasi ini harus dibenahi dari sumbernya.
  const memberRefs=refs.filter(ref=>ref.module==='anggota');
  if(memberRefs.length){
    alert(`${label} "${nama}" belum dapat dihapus karena masih digunakan oleh Anggota DPRD:\n- ${describeReferences(memberRefs)}\n\nLepaskan atau pindahkan penempatan anggota terlebih dahulu melalui modul Anggota DPRD, kemudian coba lagi.`);
    return;
  }
  const akdMembershipRefs=(t==='alat')?refs.filter(ref=>ref.module==='keanggotaan-akd'):[];
  const memberAKDRefs=(t==='anggota')?refs.filter(ref=>ref.module==='keanggotaan-akd'):[];
  if(akdMembershipRefs.length){alert(`Alat Kelengkapan "${nama}" masih memiliki record keanggotaan pada menu Keanggotaan AKD. Hapus atau nonaktifkan record keanggotaannya terlebih dahulu agar tidak meninggalkan relasi yatim.`);return}
  if(memberAKDRefs.length){alert(`Anggota DPRD "${nama}" masih tercatat pada Keanggotaan AKD. Hapus atau nonaktifkan record keanggotaannya terlebih dahulu agar relasi tetap konsisten.`);return}
  const cannotEdit=refs.filter(ref=>!canWrite(ref.module));
  if(cannotEdit.length){
    const blocked=[...new Set(cannotEdit.map(ref=>LABEL[ref.module]||ref.module))].join(', ');
    alert(`${label} "${nama}" masih dirujuk oleh data pada modul ${blocked}. Akun Anda tidak memiliki hak untuk mengubah semua record terkait, sehingga penghapusan dibatalkan. Minta admin atau pengelola modul terkait untuk memperbaiki referensinya.`);
    return;
  }
  const prompt=refs.length
    ? `Hapus ${label.toLowerCase()} "${nama}"?\n\nMaster ini masih dirujuk oleh:\n- ${describeReferences(refs)}\n\nJika dilanjutkan, hanya referensi ${label.toLowerCase()} pada record terkait yang akan dikosongkan. Record Hearing/kegiatan/anggota terkait TIDAK dihapus. Aplikasi akan mencatat perubahan melalui mekanisme audit yang tersedia.\n\nLanjutkan?`
    : `Hapus ${label.toLowerCase()} "${nama}"? Tindakan ini tidak dapat dibatalkan dan akan dicatat di audit trail.`;
  if(!confirm(prompt))return;

  // Putuskan relasi terlebih dahulu (dengan audit), baru hapus master. Jika salah satu langkah
  // gagal, coba kembalikan relasi yang sudah diubah agar data tidak tertinggal setengah jalan.
  const attempted=[];
  try{
    for(const ref of refs){
      const updated={...ref.row,diubah:today()};
      ref.fields.forEach(field=>{updated[field.key]=''});
      const operation={module:ref.module,original:{...ref.row},updated};
      attempted.push(operation);
      if(CLOUD)await arkaWrite(ref.module,updated,false,'PUTUS REFERENSI');
      const list=TABLES[ref.module]||[];
      const idx=list.findIndex(r=>String(r.id)===String(ref.row.id));
      if(idx<0)throw new Error(`Record terkait pada modul ${LABEL[ref.module]||ref.module} tidak ditemukan lagi`);
      list[idx]=updated;
      logAudit('PUTUS REFERENSI',ref.module,updated);
    }
    if(CLOUD){
      // Trigger audit database mencatat HAPUS secara atomik bersama DELETE.
      await arkaDelete(t,id);
    }
    TABLES[t]=(TABLES[t]||[]).filter(r=>String(r.id)!==String(id));
    logAudit('HAPUS',t,row);
    toast(`${label} berhasil dihapus${refs.length?' dan referensi terkait dikosongkan':''}`);
    renderModule(t);
  }catch(e){
    const rollbackErrors=[];
    for(const op of attempted.reverse()){
      try{
        if(CLOUD)await arkaWrite(op.module,op.original,false,'PEMULIHAN REFERENSI');
        const list=TABLES[op.module]||[];
        const idx=list.findIndex(r=>String(r.id)===String(op.original.id));
        if(idx>=0)list[idx]={...op.original};
      }catch(rollbackError){rollbackErrors.push(rollbackError.message||String(rollbackError));}
    }
    if(CLOUD){
      try{await arkaLoad();}catch(loadError){rollbackErrors.push(loadError.message||String(loadError));}
    }
    renderModule(t);
    const extra=rollbackErrors.length?` Sebagian pemulihan otomatis tidak berhasil; muat ulang data dan periksa record terkait. Detail: ${rollbackErrors.join('; ')}`:'';
    toast(`Penghapusan ${label.toLowerCase()} dibatalkan: ${e.message||e}.${extra}`);
  }
}

function exportFieldValue(t,r,c){

/* ============ SUPABASE ADAPTER (aktif bila CLOUD = true) ============ */
const sb = CLOUD ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const arkaTn = t => t.replace(/-/g, '_');
const arkaCn = k => k.replace(/([A-Z])/g, '_$1').toLowerCase();
const arkaCk = k => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const ARKA_MODULES = MENU.flatMap(g => g.items.map(([id]) => id))
  .filter(id => id !== 'dash' && id !== 'evidence' && id !== 'panduan' && id !== 'periksa' && id !== 'uji' && id !== 'pengguna' && !id.startsWith('an-'));
const ARKA_TYPES = Object.fromEntries(ARKA_MODULES.map(t =>
  [t, Object.fromEntries((FIELDS[t] || STD).map(c => [c[0], c[2] || 'txt']))]));
function arkaFromRow(t, r) {
  const o = {};
  for (const k in r) {
    const ck = arkaCk(k), ty = (ARKA_TYPES[t] || {})[ck];
    o[ck] = r[k] === null ? '' : (ty === 'num' ? Number(r[k]) : r[k]);
  }
  return o;
}
function arkaToRow(t, row) {
  const out = { id: row.id, dibuat: row.dibuat || null, diubah: row.diubah || null };
  for (const [k, ty] of Object.entries(ARKA_TYPES[t] || {})) {
    if (ty === 'hit' || ty === 'turunan') continue;
    let v = row[k];
    if (v === '' || v === undefined) v = null;
    if (ty === 'num' && v !== null) v = Number(v);
    out[arkaCn(k)] = v;
  }
  return out;
}
async function arkaLoad() {
  for (const t of ARKA_MODULES) {
    const { data, error } = await sb.from(arkaTn(t)).select('*');
    if (error) throw error;
    TABLES[t] = (data || []).map(r => arkaFromRow(t, r));
  }
  resolveRefs();
  migrateLegacyKetua();
}
async function arkaLoadAudit(){
  const {data,error}=await sb.from('audit_log').select('waktu,aksi,modul,ref,user_name,user_id,sumber').order('waktu',{ascending:false}).limit(200);
  if(error)throw error;
  const rows=(data||[]).map(a=>({
    waktu:a.created_at||a.waktu||a.timestamp||a.tanggal||'Waktu tidak tersedia',
    aksi:a.aksi||'AKTIVITAS',modul:a.modul||'sistem',
    ref:a.ref||a.record_id||'—',user:a.user_name||a.email||a.user_id||'Pengguna tidak diketahui'
  }));
  rows.sort((a,b)=>String(b.waktu).localeCompare(String(a.waktu)));
  AUDIT.splice(0,AUDIT.length,...rows);
  renderNotif();
}
async function arkaWrite(t, row, isNew, auditAction) {
  // Audit INSERT/UPDATE dibuat oleh trigger database dalam transaksi yang sama.
  // Jika trigger audit gagal, upsert ikut gagal dan tidak ada sukses semu di UI.

/* ============ LAMPIRAN (Supabase Storage bila mode cloud; memori bila lokal) ============ */
const ATT_BUCKET='arka-lampiran';
const ATT_LOCAL={};   // {recordId: [{id,nama,ukuran,blob}]} – hanya selama sesi
async function attList(recId){

async function renderAtt(t,id){

async function attUpload(t,id,files){
  for(const f of files){
    if(f.size>10*1024*1024){toast(f.name+' melebihi batas 10 MB');continue}
    if(!CLOUD){ (ATT_LOCAL[id]=ATT_LOCAL[id]||[]).push({id:uid(),nama:f.name,ukuran:f.size,blob:f}); continue }
    const aid=uid(), key=arkaTn(t), path=`${key}/${id}/${aid}-${f.name.replace(/[^\w.\-]/g,'_')}`;
    const {error}=await sb.storage.from(ATT_BUCKET).upload(path,f,{contentType:f.type||'application/octet-stream'});
    if(error){toast('Gagal unggah: '+error.message);continue}
    const {error:e2}=await sb.from('lampiran').insert({id:aid,modul:key,record_id:id,nama_file:f.name,path,ukuran:f.size,tipe:f.type||null,tanggal:today()});
    if(e2)toast('Gagal mencatat lampiran: '+e2.message);
  }
  logAudit('UNGGAH',t,{nama:files.length+' berkas lampiran'});
  renderAtt(t,id);
}
async function attOpen(aid,path){
  if(!CLOUD){
    const a=Object.values(ATT_LOCAL).flat().find(x=>x.id===aid);
    if(a){const el=document.createElement('a');el.href=URL.createObjectURL(a.blob);el.target='_blank';el.click()}
    return;
  }
  const {data,error}=await sb.storage.from(ATT_BUCKET).createSignedUrl(path,300);
  if(error){toast('Gagal membuka: '+error.message);return}
  const el=document.createElement('a');el.href=data.signedUrl;el.target='_blank';el.click();
}
async function attDel(t,recId,aid,path){
  if(!confirm('Hapus lampiran ini?'))return;
  if(!CLOUD){ ATT_LOCAL[recId]=(ATT_LOCAL[recId]||[]).filter(x=>x.id!==aid) }
  else{
    const {error:e1}=await sb.storage.from(ATT_BUCKET).remove([path]);
    if(e1){toast('Gagal menghapus berkas: '+e1.message);return}
    const {error:e2}=await sb.from('lampiran').delete().eq('id',aid);
    if(e2){toast('Gagal menghapus catatan: '+e2.message);return}
  }
  logAudit('HAPUS LAMPIRAN',t,{nama:recId});
  renderAtt(t,recId);
}

/* --- 3D --- */
function init3D(cv){
  const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const sc=new THREE.Scene(), cam=new THREE.PerspectiveCamera(42,1,0.1,500);
  sc.add(new THREE.AmbientLight(0xffffff,0.8));
  const dl=new THREE.DirectionalLight(0xffffff,0.6); dl.position.set(10,20,15); sc.add(dl);
  const root=new THREE.Group(); sc.add(root);
  const st={rx:-0.35,ry:0.4,drag:false,mx:0,my:0,moved:0,zoom:30,stop:false};
  const rc=new THREE.Raycaster(), mv=new THREE.Vector2();
  cv.onpointerdown=e=>{st.drag=true;st.mx=e.clientX;st.my=e.clientY;st.moved=0;cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{ if(!st.drag)return; const dx=e.clientX-st.mx, dy=e.clientY-st.my;
    st.ry+=dx*0.008; st.rx=Math.max(-1.2,Math.min(0.4,st.rx+dy*0.008)); st.mx=e.clientX; st.my=e.clientY; st.moved+=Math.abs(dx)+Math.abs(dy) };
  cv.onpointerup=e=>{ st.drag=false; if(st.moved<5)pick(e) };
  cv.onwheel=e=>{ e.preventDefault(); st.zoom=Math.max(14,Math.min(60,st.zoom+e.deltaY*0.02)) };
  function pick(e){
    const b=cv.getBoundingClientRect();
    mv.x=((e.clientX-b.left)/b.width)*2-1; mv.y=-((e.clientY-b.top)/b.height)*2+1;
    rc.setFromCamera(mv,cam);
    const hit=rc.intersectObjects(root.children,true).find(h=>h.object.userData&&h.object.userData.onPick);
    if(hit)hit.object.userData.onPick();
  }
  function loop(){
    if(st.stop)return;
    const w=cv.clientWidth||600, h=cv.clientHeight||440;
    if(cv.width!==Math.floor(w*r.getPixelRatio())||cv.height!==Math.floor(h*r.getPixelRatio())){ r.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
    root.rotation.set(st.rx,st.ry,0); cam.position.set(0,6,st.zoom); cam.lookAt(0,0,0);
    r.render(sc,cam); requestAnimationFrame(loop);
  }
  loop();
  return {r,root,st,clear(){ while(root.children.length)root.children.pop(); }};
}
function box(w,h,d,c,onPick){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.1}));
  if(onPick)m.userData.onPick=onPick;
  return m;
}
function label(txt,p){
  const c=document.createElement('canvas'); c.width=512; c.height=96;
  const x=c.getContext('2d');
  x.fillStyle='rgba(16,24,40,.85)'; x.fillRect(0,0,512,96);
  x.font='bold 36px system-ui,sans-serif'; x.fillStyle='#ffffff'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(txt.length>26?txt.slice(0,25)+'…':txt,256,50);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  sp.scale.set(5,0.94,1); sp.position.copy(p); return sp;
}
function arrow(a,b,c){
  T3.root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.clone(),b.clone()]),new THREE.LineBasicMaterial({color:c})));
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.35,0.9,12),new THREE.MeshStandardMaterial({color:c}));
  cone.geometry.rotateX(Math.PI/2);
  cone.position.copy(a.clone().lerp(b,0.8)); cone.lookAt(b);
  T3.root.add(cone);
}
function build3DMenu(){
  const ids=DATA_MODS.filter(t=>GROUP_OF[t]===PG.gi);
  const byL={}; ids.forEach(id=>(byL[lvl(id)]=byL[lvl(id)]||[]).push(id));
  const levels=Object.keys(byL).map(Number).sort((a,b)=>a-b), pos={};
  levels.forEach((L,li)=>byL[L].forEach((id,i)=>{ pos[id]=new THREE.Vector3((li-(levels.length-1)/2)*6,0,(i-(byL[L].length-1)/2)*3.4); }));
  ids.forEach(id=>{
    const on=PG.sel===id, h=on?1.8:1.1;
    const m=box(2.6,h,2.4,on?0xf79009:GCOL(PG.gi),()=>{PG.sel=id;T3.clear();build3DMenu();renderInfo()});
    m.position.copy(pos[id]); m.position.y=h/2;
    T3.root.add(m);
    const lp=pos[id].clone(); lp.y=h+0.9; T3.root.add(label(LABEL[id],lp));
  });
  ids.forEach(id=>deps(id).filter(d=>pos[d]).forEach(d=>arrow(pos[d].clone().setY(0.5),pos[id].clone().setY(0.5),0x1d4ed8)));

function build3DInt(){
  const n=MENU.length, R=11;
  const cnt=MENU.map((g,i)=>DATA_MODS.filter(t=>GROUP_OF[t]===i).length);
  const P=MENU.map((g,i)=>{const a=i/n*Math.PI*2; return new THREE.Vector3(Math.cos(a)*R,0,Math.sin(a)*R)});
  MENU.forEach((g,i)=>{
    if(!cnt[i])return;
    const h=0.8+cnt[i]*0.14;
    const m=box(2.8,h,2.8,GCOL(i),()=>{PG.gi=i;PG.sel=null;PG.mode='menu';renderPanduan()});
    m.position.copy(P[i]); m.position.y=h/2;
    T3.root.add(m);
    T3.root.add(label(g.g,P[i].clone().setY(h+1)));
  });
  const agg={};
  DATA_MODS.forEach(t=>deps(t).forEach(d=>{ const a=GROUP_OF[d], b=GROUP_OF[t]; if(a===b)return; const k=a+'>'+b; agg[k]=(agg[k]||0)+1; }));
  Object.entries(agg).forEach(([k,c])=>{
    const [a,b]=k.split('>').map(Number);
    arrow(P[a].clone().setY(0.6),P[b].clone().setY(0.6),0xf79009);
    T3.root.add(label(c+' keterkaitan',P[a].clone().lerp(P[b],0.5).setY(2.2)));
  });
}
function draw3D(){
  const cv=$('#g3'); if(!cv)return;
  if(T3){ T3.st.stop=true; try{T3.r.forceContextLoss()}catch(e){} T3=null; }

/* ============ 1. PEMERIKSAAN DATA PER MODUL ============ */
/* Kosong yang memang dapat diterima menurut konteks bisnis, bukan sekadar karena field nullable. */
function auditEmptyIsExpected(t,r,k){
  if(t==='anggota' && k==='komisi'){
    const jabatan=String(r.jabatan||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLocaleLowerCase('id-ID').replace(/[._,]/g,' ').replace(/\\s+/g,' ').trim();
    // Hanya jabatan Pimpinan DPRD yang dikenali secara eksplisit yang dikecualikan.
    // Jangan mengecualikan Wakil Ketua Komisi/Fraksi hanya karena mengandung frasa "Wakil Ketua".
    const ketuaDprd=/(^|\\b)(ketua dprd|ketua dewan|pimpinan dprd|pimpinan dewan)(\\b|$)/.test(jabatan);
    const wakilKetuaDprd=/^wakil ketua(?:\\s+(?:i{1,3}|iv|v|[1-3]))?(?:\\s+(?:dprd|dewan)(?:\\s+kabupaten.*)?)?$/.test(jabatan);
    if(ketuaDprd||wakilKetuaDprd) return true;
  }
  // Node tingkat atas tidak mempunyai induk.
  if(t==='pohon' && k==='induk' && String(r.level||'')==='Sasaran Strategis') return true;
  // Tanggal penetapan belum harus ada ketika Propemperda masih dalam persiapan/proses.
  if(t==='propemperda' && k==='tanggal' && String(r.status||'')!=='Selesai') return true;
  // Produk hukum berstatus Draft dapat belum ditautkan ke regulasi yang sudah tercatat.
  if(t==='jdih' && k==='regulasi' && String(r.status||'')==='Draft') return true;
  return false;
}
function auditMissingMessage(t,r,k,lbl,tingkat){
  if(t==='cascading' && k==='tujuan')
    return 'Sasaran Tujuan belum dipilih; tautkan ke sasaran yang benar jika hubungan cascading sudah ditetapkan.';
  if(t==='monitoring' && k==='sasaran')
    return 'Sasaran belum dipilih; tautkan monitoring ke sasaran yang menjadi objek pemantauan.';
  if(t==='apbd' && k==='ppas')
    return 'Belum terhubung ke PPAS induk; tautkan ke PPAS yang sesuai jika record induknya tersedia. Untuk data historis, catat konteks pada Keterangan.';
  if(t==='anggota' && k==='komisi'){
    const jabatan=String(r.jabatan||'').trim();
    if(!jabatan) return 'Komisi belum diisi dan kolom Jabatan juga kosong/tidak terbaca. Lengkapi jabatan dari sumber resmi agar pemeriksaan dapat membedakan Pimpinan DPRD dari anggota yang perlu ditempatkan pada Komisi.';
    return 'Anggota belum ditempatkan pada Komisi (Jabatan tercatat: '+jabatan+'). Konfirmasikan susunan keanggotaan resmi. Pengecualian hanya berlaku bagi jabatan Pimpinan DPRD yang dikenali secara eksplisit.';
  }
  if(t==='propemperda' && k==='tanggal')
    return 'Status Selesai tetapi Tanggal Penetapan belum diisi.';
  if(t==='jdih' && k==='regulasi')
    return 'Regulasi Terkait belum dipilih; tautkan ke record Regulasi untuk produk hukum yang sudah ditetapkan.';
  if(tingkat==='Kritis') return 'Kolom wajib belum diisi.';
  if(tingkat==='Peringatan' && k==='tanggal')
    return 'Tanggal belum diisi; lengkapi jika tanggal tersebut sudah ditetapkan pada tahap record ini.';
  if(tingkat==='Peringatan' && k==='rel')
    return 'Referensi belum dipilih; periksa apakah hubungan ini sudah harus ditetapkan.';
  if(tingkat==='Peringatan') return 'Kolom belum diisi; konfirmasikan apakah diperlukan pada tahap record ini.';
  return 'Nilai belum diisi.';
}
function auditModule(t){
  const cols=FIELDS[t]||STD, rows=dbAll(t), out=[], kodeCount={};
  rows.forEach((r,i)=>{
    const ref=r.kode||r.nama||('baris '+(i+1));
    cols.forEach(([k,lbl,ty,opt,metaRaw])=>{
      const meta=metaRaw && !Array.isArray(metaRaw) && typeof metaRaw==='object' ? metaRaw : {};
      const optional=meta.opsional===true || meta.optional===true;
      const required=meta.wajib===true || meta.required===true || k==='kode' || k==='nama' || (ty==='sel'&&k==='status') || (ty==='rel'&&!optional) || (ty==='date'&&!optional);
      const v=r[k], kosong=v===undefined||v===null||v===''||(typeof v==='string'&&v.trim()==='');
      const add=(tingkat,pesan)=>out.push({tingkat,ref,kol:lbl,pesan});
      // Kolom turunan/dihitung bukan sumber input.
      if(ty==='hit'||ty==='turunan') return;
      if(kosong){
        // Bedakan kondisi kosong yang sah menurut konteks dari kekurangan yang perlu ditinjau.
        if(auditEmptyIsExpected(t,r,k)||optional) return;
        if(required){
          const tingkat=(k==='kode'||k==='nama'||meta.wajib===true||meta.required===true)?'Kritis':'Peringatan';
          add(tingkat,auditMissingMessage(t,r,k,lbl,tingkat));
        }
        return;
      }
      if(ty==='rel'){
        if(!dbAll(opt).some(x=>x.id===v)) add('Kritis','Referensi tidak ditemukan pada modul '+(LABEL[opt]||opt)+'.');
        else if(meta.via){ const m=dbAll(opt).find(x=>x.id===v); if(m&&m[meta.via]!==r.id) add('Peringatan','Referensi anggota belum cocok dengan penempatan pada '+(LABEL[t]||t)+'.'); }
      } else if(ty==='sel'){
        if(!Array.isArray(opt)||!opt.includes(v)) add('Kritis','Nilai "'+v+'" tidak termasuk pilihan yang dikonfigurasi.');
      } else if(ty==='num'){
        const n=Number(v);
        if(!Number.isFinite(n)) add('Kritis','Nilai bukan angka yang valid.');
        else if(n<0) add('Kritis','Nilai negatif.');
      } else if(ty==='date'){
        const parsed=new Date(v);
        if(Number.isNaN(parsed.getTime())) add('Kritis','Format tanggal tidak valid.');
      } else if(k==='kode'||k==='nama'){
        if(!String(v).trim()) add('Kritis','Kolom wajib belum diisi.');
      }
    });
    if(r.kode) kodeCount[String(r.kode).trim().toLocaleLowerCase('id-ID')]=(kodeCount[String(r.kode).trim().toLocaleLowerCase('id-ID')]||0)+1;
  });
  Object.entries(kodeCount).forEach(([k,n])=>{ if(n>1) out.push({tingkat:'Kritis',ref:k,kol:'Kode',pesan:'Kode ganda ('+n+' record); periksa identitas unik pada modul ini.'}) });
  return out;
}
function checkHtml(t){
  const issues=auditModule(t), kr=issues.filter(x=>x.tingkat==='Kritis').length, pr=issues.length-kr;
  const head=`<div class="card" style="margin-bottom:0"><div class="row"><b>Hasil pemeriksaan data · ${esc(LABEL[t])}</b><span class="pill ${kr?'s-Terlambat':'s-Selesai'}">${kr} kritis · ${pr} peringatan</span></div>`;

  return head+`<div class="tbl" style="margin-top:8px"><table><tr><th>Tingkat</th><th>Record</th><th>Kolom</th><th>Temuan</th></tr>${issues.slice(0,60).map(x=>`<tr><td><span class="pill ${x.tingkat==='Kritis'?'s-Terlambat':'s-Draft'}">${x.tingkat}</span></td><td>${esc(x.ref)}</td><td>${esc(x.kol)}</td><td>${esc(x.pesan)}</td></tr>`).join('')}</table></div>${issues.length>60?`<div class="hint">Menampilkan 60 dari ${issues.length} temuan.</div>`:''}</div>`;
}

async function sysChecks(){

  // Pemeriksaan browser bersifat diagnostik, bukan bukti bahwa backend tersedia.

    add('Browser','Penyimpanan lokal','OK','Browser mengizinkan akses localStorage untuk preferensi dan hasil Daftar Uji.');
  } catch(e) {
    add('Browser','Penyimpanan lokal','Peringatan','localStorage tidak dapat ditulis; hasil Daftar Uji mungkin hanya bertahan selama halaman terbuka.');
  }
  add('Browser','Koneksi browser',navigator.onLine?'Informasi':'Peringatan',navigator.onLine?'Browser melaporkan jaringan aktif; ini tidak dengan sendirinya membuktikan Supabase dapat dijangkau.':'Browser melaporkan offline; koneksi ke Supabase kemungkinan tidak tersedia.');
  add('Browser','Pustaka 3D (three.js)',typeof THREE!=='undefined'?'OK':'Peringatan',typeof THREE!=='undefined'?'Pustaka dimuat.':'Pustaka tidak dimuat; visual 3D pada panduan tidak tersedia, tetapi pemeriksaan data tetap dapat berjalan.');

  if(!CLOUD){
    const cfg=arkaReadConfig();
    const reasons=[];
    if(!cfg.url && !SUPABASE_URL) reasons.push('Project URL belum tersedia');
    if(!cfg.anonKey) reasons.push('anon/publishable key belum diisi');
    if(typeof supabase==='undefined') reasons.push('pustaka Supabase belum dimuat');
    add('Cloud','Konfigurasi Supabase','Peringatan',(reasons.join('; ')||'Koneksi cloud belum aktif')+'. Pemeriksaan database dilewati; tidak ada penulisan data cloud.');
  } else {
    let cloudUser=null, authError=null;
    try {
      const auth=await sb.auth.getUser();
      authError=auth.error||null; cloudUser=auth.data?.user||null;
      if(authError) throw authError;
      if(!cloudUser) add('Akun','Sesi autentikasi','Gagal','Tidak ada sesi Supabase aktif. Login kembali sebelum menggunakan pemeriksaan cloud.');
      else add('Akun','Sesi autentikasi','OK','Sesi Supabase aktif; detail identitas tidak ditampilkan pada laporan pemeriksaan.');
    } catch(e) {
      add('Akun','Sesi autentikasi','Gagal','Sesi tidak dapat diverifikasi. Login kembali atau periksa jaringan dan konfigurasi Supabase.');
    }
    if(cloudUser){
      try {
        const {data:profile,error}=await sb.from('profiles').select('peran,unit').eq('id',cloudUser.id).maybeSingle();
        if(error) add('Akun','Profil dan peran','Gagal','Profil tidak dapat dibaca. Periksa tabel profiles dan kebijakan RLS.');
        else if(!profile||!profile.peran) add('Akun','Profil dan peran','Gagal','Profil pengguna atau peran belum tersedia.');
        else if(profile.peran!==ARKA_ROLE || (profile.peran==='pengelola'&&!profile.unit)) add('Akun','Profil dan peran','Peringatan','Peran/unit pada profil tidak sepenuhnya cocok dengan konteks login aplikasi. Login ulang atau periksa konfigurasi profil.');
        else add('Akun','Profil dan peran','OK','Profil memiliki peran dan konfigurasi unit yang diperlukan.');
      } catch(e) {
        add('Akun','Profil dan peran','Gagal','Pemeriksaan profil gagal dilakukan. Periksa koneksi dan izin baca profiles.');
      }
    }

    // Hanya SELECT id dengan limit 1. Pemeriksaan dibatasi dalam kelompok kecil dan tidak melakukan INSERT/UPDATE/DELETE.
    let tableOk=0; const tableFailed=[]; const batchSize=8;
    for(let i=0;i<DATA_MODS.length;i+=batchSize){
      const batch=DATA_MODS.slice(i,i+batchSize);
      const results=await Promise.all(batch.map(async t=>{
        try { const {error}=await sb.from(arkaTn(t)).select('id').limit(1); return {t,ok:!error}; }
        catch(e){ return {t,ok:false}; }
      }));
      results.forEach(x=>{ if(x.ok)tableOk++; else tableFailed.push(LABEL[x.t]||x.t); });
    }
    add('Cloud','Akses baca tabel modul',tableFailed.length?'Gagal':'OK',`${tableOk} dari ${DATA_MODS.length} tabel modul dapat dibaca dengan query uji baca-saja.`+(tableFailed.length?' Tabel bermasalah: '+tableFailed.slice(0,10).join(', ')+(tableFailed.length>10?' dan lainnya.':'.'):' Tidak ada data bisnis yang diubah.'));

    // Membaca metadata Storage saja; kegagalan dapat disebabkan kebijakan list yang sengaja dibatasi.
    try {
      const {error}=await sb.storage.from(ATT_BUCKET).list('',{limit:1});
      if(error) add('Cloud','Storage lampiran','Peringatan','Folder bucket tidak dapat dibaca oleh sesi ini. Periksa keberadaan bucket dan policy Storage; pemeriksaan ini tidak mengunggah, mengubah, atau menghapus berkas.');
      else add('Cloud','Storage lampiran','OK','Endpoint dan operasi baca daftar bucket berhasil. Upload/hapus berkas tidak diuji untuk menghindari perubahan pada data produksi.');
    } catch(e) {
      add('Cloud','Storage lampiran','Peringatan','Status bucket tidak dapat dipastikan. Pemeriksaan bersifat baca-saja dan tidak mengubah berkas.');
    }

    // Skema dan bucket Daftar Uji: hanya operasi baca; migration tidak dijalankan otomatis dari browser.
    const ujiTableNames=['uji_sesi','uji_hasil','uji_bukti'];
    const ujiTableChecks=await Promise.all(ujiTableNames.map(async name=>{
      try { const {error}=await sb.from(name).select('id').limit(1); return {name,ok:!error}; }
      catch(e){return {name,ok:false};}
    }));
    const missingUjiTables=ujiTableChecks.filter(x=>!x.ok).map(x=>x.name);
    add('Cloud','Skema Daftar Uji',missingUjiTables.length?'Peringatan':'OK',missingUjiTables.length?'Tabel hasil uji belum seluruhnya dapat dibaca: '+missingUjiTables.join(', ')+'. Jalankan ARKA_Migrasi_Daftar_Uji_v16.sql dan periksa RLS.':'Tabel sesi, hasil, dan bukti uji dapat dibaca; pemeriksaan tidak mengubah data.');
    try {
      const {error}=await sb.storage.from(UJI_EVIDENCE_BUCKET).list('',{limit:1});
      if(error)add('Cloud','Storage bukti pengujian','Peringatan','Bucket khusus bukti uji belum tersedia atau policy baca menolak akses. Periksa migrasi SQL v16; tidak ada berkas yang diubah.');
      else add('Cloud','Storage bukti pengujian','OK','Bucket privat bukti pengujian dapat diakses untuk operasi baca. Upload/hapus tidak diuji pada Pemeriksaan Sistem.');
    } catch(e){add('Cloud','Storage bukti pengujian','Peringatan','Bucket bukti uji belum dapat diverifikasi; pemeriksaan tetap bersifat baca-saja.');}
  }

  let kritis=0, peringatan=0, records=0; const kosong=[], rincianTemuan=[];
  DATA_MODS.forEach(t=>{
    const issues=auditModule(t);
    kritis+=issues.filter(x=>x.tingkat==='Kritis').length;
    peringatan+=issues.filter(x=>x.tingkat!=='Kritis').length;
    issues.forEach(x=>rincianTemuan.push({...x,modul:t,modulLabel:LABEL[t]||t}));
    records+=dbAll(t).length; if(!dbAll(t).length)kosong.push(LABEL[t]);
  });
  add('Data','Jumlah modul dan record','Informasi',`${DATA_MODS.length} modul dan ${records} record dalam snapshot aplikasi. Ini bukan hitungan ulang dari database; data dibaca dari data yang sudah dimuat ke aplikasi.`);
  add('Dokumentasi','Sidik struktur','Informasi',`${sidikStruktur()} — pengenal konfigurasi MENU/FIELDS saat ini; bandingkan dengan Kamus Data yang disimpan, karena perbandingan otomatis dengan file eksternal tidak tersedia.`);
  add('Data','Modul tanpa data',kosong.length?'Peringatan':'OK',kosong.length?`${kosong.length} modul kosong: ${kosong.join(', ')}. Modul kosong belum tentu salah; konfirmasikan apakah memang sudah waktunya diisi.`:'Semua modul memiliki sedikitnya satu record pada snapshot aplikasi.');
  add('Data','Ringkasan temuan kritis','Informasi',kritis?`${kritis} temuan kritis ditemukan pada snapshot aplikasi. Setiap temuan ditampilkan pada baris Rincian data di bawah, beserta modul, record, kolom, dan sebab yang terdeteksi.`:'Tidak ada temuan kritis dari aturan validasi yang tersedia. Ini bukan jaminan bahwa seluruh data substantif telah benar.');
  add('Data','Ringkasan peringatan data','Informasi',peringatan?`${peringatan} peringatan ditemukan. Rinciannya ditampilkan per modul/record/kolom di bawah; tinjau sebelum memutuskan apakah perlu diperbaiki.`:'Tidak ada peringatan data dari aturan validasi yang tersedia.');
  const MAX_DETAIL=100;
  rincianTemuan.slice(0,MAX_DETAIL).forEach(x=>add('Rincian data',`${x.modulLabel} · ${x.ref} · ${x.kol}`,x.tingkat==='Kritis'?'Gagal':'Peringatan',x.pesan,{moduleId:x.modul}));
  if(rincianTemuan.length>MAX_DETAIL) add('Data','Batas rincian ditampilkan','Peringatan',`Ditampilkan ${MAX_DETAIL} dari ${rincianTemuan.length} temuan. Ekspor CSV atau jalankan Periksa data per modul untuk melihat rincian lainnya.`);
  add('Keamanan','Mutasi data selama pemeriksaan','OK','Pemeriksaan Sistem hanya menjalankan validasi lokal dan query baca-saja. Tidak ada operasi tambah, ubah, atau hapus yang dijalankan oleh pemeriksaan ini.');
  return r;
}

  box.innerHTML=`<table><tr><th>Grup</th><th>Pemeriksaan</th><th>Status</th><th>Keterangan</th><th>Aksi</th></tr>${PERIKSA_LAST.map(x=>`<tr><td>${esc(x.grup)}</td><td>${esc(x.item)}</td><td><span class="pill ${statusPeriksaClass(x.status)}">${esc(x.status)}</span></td><td>${esc(x.detail)}</td><td>${x.moduleId&&isDataMod(x.moduleId)?`<button type="button" data-open-check-module="${esc(x.moduleId)}">Buka modul</button>`:'—'}</td></tr>`).join('')}</table>`;
  box.onclick=e=>{const b=e.target.closest('[data-open-check-module]');if(b)location.hash=b.dataset.openCheckModule;};
  if(runButton)runButton.disabled=false;

function exportPeriksa(){
  const e=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\uFEFF'+['Versi,Waktu Pemeriksaan,Grup,Pemeriksaan,Status,Keterangan',...PERIKSA_LAST.map(x=>[ARKA_APP_VERSION,PERIKSA_RUN_AT||'',x.grup,x.item,x.status,x.detail].map(e).join(','))].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`ARKA_pemeriksaan_v${ARKA_APP_VERSION.replace(/[^0-9.]/g,'')}_${today()}.csv`; a.click();
}

function ujiLoadLocalSessions(){
  try{
    const saved=JSON.parse(localStorage.getItem(UJI_LOCAL_SESSIONS_KEY)||'null');
    if(Array.isArray(saved)&&saved.length){
      UJI_SESSIONS=saved.map(ujiNormaliseSession).sort((a,b)=>new Date(b.mulai_pada)-new Date(a.mulai_pada));
      return;
    }
  }catch(_){ }
  let legacy={};
  try{ const value=JSON.parse(localStorage.getItem(UJI_LEGACY_STORAGE_KEY)||'{}'); if(value&&typeof value==='object'&&!Array.isArray(value))legacy=value; }catch(_){ }
  const hasLegacy=Object.values(legacy).some(v=>v&&(v.status&&v.status!=='Belum diuji'||v.catatan||v.bukti));
  const results={};
  Object.entries(legacy).forEach(([key,value])=>{ if(value&&typeof value==='object')results[key]=ujiNormaliseResult(value); });
  UJI_SESSIONS=[ujiNormaliseSession({
    id:uid(),nama:hasLegacy?'Sesi migrasi hasil uji lokal':'Sesi Uji Lokal '+new Date().toLocaleString('id-ID'),
    versi_aplikasi:ARKA_APP_VERSION,mode_sumber:'Lokal',status:'Berjalan',mulai_pada:new Date().toISOString(),
    dibuat_oleh_nama:ARKA_NAMA||'Penguji lokal',catatan:hasLegacy?'Memuat hasil dari versi Daftar Uji sebelumnya di browser ini.':'Sesi lokal awal.',hasil:results
  })];
  ujiSaveLocalSessions();
}
function ujiSaveLocalSessions(){
  try{
    if(UJI_ACTIVE_SESSION&&!UJI_IS_CLOUD){
      UJI_ACTIVE_SESSION.hasil=UJI_ACTIVE_RESULTS;
      const idx=UJI_SESSIONS.findIndex(s=>s.id===UJI_ACTIVE_SESSION.id);
      if(idx>=0)UJI_SESSIONS[idx]=UJI_ACTIVE_SESSION;else UJI_SESSIONS.unshift(UJI_ACTIVE_SESSION);
    }
    UJI_SESSIONS=UJI_SESSIONS.sort((a,b)=>new Date(b.mulai_pada)-new Date(a.mulai_pada)).slice(0,40);
    localStorage.setItem(UJI_LOCAL_SESSIONS_KEY,JSON.stringify(UJI_SESSIONS));

function skenarioUji(t){
  const cols=FIELDS[t]||STD, st=cols.find(c=>c[0]==='status'), rel=cols.filter(c=>c[2]==='rel');
  const list=[
    {id:'buka-menu',jenis:'Umum',text:`Buka menu "${LABEL[t]}": tabel dan kartu statistik tampil tanpa error.`},
    {id:'tambah-simpan',jenis:'Umum',text:'Tambah satu record uji dengan data yang sesuai aturan; setelah Simpan, record tampil satu kali.'},
    {id:'ubah-simpan',jenis:'Umum',text:'Ubah satu field yang aman pada record uji; perubahan terlihat setelah disimpan dan dimuat ulang.'},
    {id:'pencarian',jenis:'Umum',text:'Cari menggunakan sebagian nama/kode; hasil sesuai dan tidak menampilkan record yang tidak cocok.'}
  ];
  if(st)list.push({id:'filter-status',jenis:'Umum',text:'Filter status: hanya record dengan status yang dipilih yang tampil; termasuk pilihan status lain yang tersedia.'});
  rel.forEach(c=>list.push({id:'rel-'+c[0],jenis:'Relasi',text:`Relasi "${c[1]}": pilihan berasal dari ${LABEL[c[3]]||c[3]} dan record tersimpan menampilkan referensi yang benar.`}));
  list.push({id:'periksa-data',jenis:'Integritas',text:'Jalankan Periksa data; temuan menunjuk ke record/kolom yang benar dan field opsional kosong tidak dianggap sebagai kesalahan.'});
  if(UJI_CSV_MODULES.has(t))list.push({id:'ekspor-csv',jenis:'Fitur bersama',text:'Ekspor CSV pada modul perwakilan ini: nama kolom, karakter Indonesia, relasi/angka dan jumlah baris sesuai data.'});
  if(UJI_PDF_MODULES.has(t))list.push({id:'cetak-pdf',jenis:'Fitur bersama',text:'Pratinjau cetak/PDF pada modul perwakilan ini: kolom dan baris relevan tidak terpotong secara material.'});
  if(UJI_LAMPIRAN_MODULES.has(t))list.push({id:'lampiran',jenis:'Bukti',text:'Lampiran pada record yang relevan: daftar, unggah, buka, dan hapus berkas uji sesuai hak akses; jangan gunakan berkas/data sensitif.'});
  (UJI_KHUSUS[t]||[]).forEach(x=>list.push({...x,jenis:'Khusus'}));
  return list;
}

function ujiScenarioMeta(scope,test){

function ujiExpectedResult(test){
  if(test.expected||test.hasilHarapan)return String(test.expected||test.hasilHarapan);
  if(test.id==='buka-menu')return 'Halaman terbuka tanpa error; tabel, statistik, dan aksi yang berwenang terlihat.';
  if(test.id==='tambah-simpan')return 'Record uji berhasil disimpan satu kali, tampil pada tabel, dan tetap ada setelah data dimuat ulang.';
  if(test.id==='ubah-simpan')return 'Perubahan tersimpan, tampil pada record yang benar, dan tetap ada setelah dimuat ulang.';
  if(test.id==='pencarian')return 'Hasil hanya memuat record yang cocok dengan kata/kode yang dicari.';
  if(test.id==='filter-status')return 'Semua baris yang tampil sesuai status terpilih; baris dengan status lain tidak tampil.';
  if(String(test.id).startsWith('rel-'))return 'Pilihan berasal dari master terkait; record menyimpan referensi valid dan nama yang benar ditampilkan.';
  if(test.id==='periksa-data')return 'Temuan sesuai kondisi data aktual; field opsional kosong tidak salah dianggap sebagai kesalahan.';
  if(test.id==='ekspor-csv')return 'CSV dapat dibuka, karakter Indonesia benar, dan baris/kolom sesuai data yang diekspor.';
  if(test.id==='cetak-pdf')return 'Pratinjau cetak memuat kolom dan baris relevan tanpa terpotong secara material.';
  if(test.id==='lampiran')return 'Lampiran tampil dan bisa dibuka bagi pengguna yang berwenang; perubahan lampiran tercatat.';
  if(test.id==='hapus-hak-akses')return 'Hanya record yang dipilih yang terhapus; penolakan hak akses dan relasi induk tetap benar.';
  return 'Perilaku dalam skenario terpenuhi, hasil dapat ditelusuri, dan tidak ada data sumber/relasi lain yang berubah tanpa izin.';
}

async function ujiSave(key,field,value){
  if(!ujiSessionEditable()){toast('Pilih atau buat sesi uji berstatus Berjalan. Sesi selesai dan peran hanya-baca tidak dapat diubah.');return false;}
  const rec={...ujiGet(key)};
  if(field==='status'){
    if(!UJI_STATUSES.includes(value))return false;
    if(value==='Tidak Berlaku'&&!String(rec.catatan||'').trim()){
      const reason=prompt('Tuliskan alasan mengapa skenario ini tidak berlaku:','');
      if(reason===null||!String(reason).trim()){
        const control=$$('[data-uji-key][data-uji-field="status"]').find(n=>n.dataset.ujiKey===key);
        if(control)control.value=rec.status;
        toast('Alasan wajib diisi sebelum memilih Tidak Berlaku.');return false;
      }
      rec.catatan=String(reason).trim();
      const note=$$('[data-uji-key][data-uji-field="catatan"]').find(n=>n.dataset.ujiKey===key);if(note)note.value=rec.catatan;
    }
    rec.status=value;rec.waktuUji=value==='Belum diuji'?null:new Date().toISOString();
    rec.penguji=value==='Belum diuji'?'':(ARKA_NAMA||'Penguji lokal');rec.versi=ARKA_APP_VERSION;
    if(value==='Belum diuji')rec.statusPerbaikan='Belum ditangani';
  }else if(field==='catatan')rec.catatan=String(value||'');
  else if(field==='bukti')rec.bukti=String(value||'');
  else if(field==='hasilAktual')rec.hasilAktual=String(value||'');
  else if(field==='dampak'&&UJI_IMPACTS.includes(value))rec.dampak=value;
  else if(field==='reproduksi')rec.reproduksi=String(value||'');
  else if(field==='statusPerbaikan'&&UJI_FOLLOWUP.includes(value)){
    if(value==='Selesai'&&rec.status==='Gagal'&&!String(rec.catatanPerbaikan||'').trim()){
      const verification=prompt('Sebelum menutup kegagalan, tuliskan ringkasan perbaikan dan hasil verifikasi ulang:','');
      if(verification===null||!String(verification).trim()){
        const control=$$('[data-uji-key][data-uji-field="statusPerbaikan"]').find(n=>n.dataset.ujiKey===key);
        if(control)control.value=rec.statusPerbaikan;
        toast('Catatan perbaikan/verifikasi ulang wajib diisi sebelum kegagalan dinyatakan selesai.');return false;
      }
      rec.catatanPerbaikan=String(verification).trim();
      const note=$$('[data-uji-key][data-uji-field="catatanPerbaikan"]').find(n=>n.dataset.ujiKey===key);if(note)note.value=rec.catatanPerbaikan;
    }
    rec.statusPerbaikan=value;
  }
  else if(field==='catatanPerbaikan')rec.catatanPerbaikan=String(value||'');
  rec.diubahPada=new Date().toISOString();if(!rec.hasilHarapan){const meta=UJI_SCENARIO_REGISTRY[key];if(meta)rec.hasilHarapan=ujiExpectedResult(meta.test);}
  UJI_ACTIVE_RESULTS[key]=rec;
  if(!UJI_IS_CLOUD&&UJI_ACTIVE_SESSION)UJI_ACTIVE_SESSION.hasil=UJI_ACTIVE_RESULTS;
  ujiSaveLocalActive();
  if(UJI_IS_CLOUD){
    const pendingKey=ujiPendingKey(UJI_ACTIVE_SESSION.id,key);
    try{await ujiCloudSaveResult(key,rec,UJI_ACTIVE_SESSION.id);delete UJI_PENDING_SYNC[pendingKey];ujiSavePendingQueue();}
    catch(e){UJI_PENDING_SYNC[pendingKey]={key,rec,sessionId:UJI_ACTIVE_SESSION.id,pendingKey};ujiSavePendingQueue();UJI_NOTICE='Ada hasil yang belum tersinkron ke Supabase: '+ujiSafeErr(e);toast('Hasil tersimpan sebagai cadangan lokal, tetapi gagal sinkron ke cloud. Gunakan Coba sinkron ulang.');}
  }
  ujiRenderPanelNotice();ujiRenderMetrics();ujiRenderHistory();ujiUpdateMeta(key);
  return true;
}
function ujiUpdateMeta(key){
  const rec=ujiGet(key);const meta=$$('[data-uji-meta]').find(n=>n.dataset.ujiMeta===key);const updated=$$('[data-uji-updated]').find(n=>n.dataset.ujiUpdated===key);
  if(meta)meta.textContent=`Versi ${rec.versi||ARKA_APP_VERSION} · Penguji: ${rec.penguji||'—'} · Waktu uji: ${ujiTime(rec.waktuUji)}`;

async function ujiRetryPendingSync(){
  if(!UJI_IS_CLOUD||!CLOUD){toast('Mode cloud belum siap. Perbaiki koneksi/migrasi lalu muat ulang Daftar Uji sebelum mencoba sinkron ulang.');return;}
  const items=Object.values(UJI_PENDING_SYNC);if(!items.length){toast('Tidak ada hasil yang menunggu sinkronisasi.');return;}
  let ok=0,fail=0;
  for(const p of items){const pendingKey=p.pendingKey||ujiPendingKey(p.sessionId,p.key);try{await ujiCloudSaveResult(p.key,p.rec,p.sessionId);delete UJI_PENDING_SYNC[pendingKey];ok++;}catch(_){fail++;}}
  ujiSavePendingQueue();
  UJI_NOTICE=fail?'Sebagian hasil belum tersinkron ('+fail+').':'Semua hasil tertunda berhasil disinkronkan.';
  toast(UJI_NOTICE);ujiRenderPanelNotice();ujiRenderMetrics();ujiRenderHistory();
}
async function ujiCreateSessionRecord(name,silent=false){

  if(UJI_IS_CLOUD){

    const payload={id:uid(),nama:String(name||ujiNewSessionName()),app_version:ARKA_APP_VERSION,scenario_total:UJI_RENDERED_MODEL.total||0,source_mode:'Cloud',status:'Berjalan',notes:null,started_at:now,finished_at:null,created_by:createdBy,created_by_name:ARKA_NAMA||'Penguji'};

    const s=ujiNormaliseSession(data);s.hasil={};UJI_SESSIONS.unshift(s);UJI_ACTIVE_SESSION=s;UJI_ACTIVE_RESULTS={};UJI_ACTIVE_EVIDENCE={};
  }else{
    const s=ujiNormaliseSession({id:uid(),nama:String(name||ujiNewSessionName()),versi_aplikasi:ARKA_APP_VERSION,mode_sumber:'Lokal',status:'Berjalan',mulai_pada:now,dibuat_oleh_nama:ARKA_NAMA||'Penguji lokal',hasil:{}});

  }
  try{localStorage.setItem(UJI_ACTIVE_SESSION_KEY,UJI_ACTIVE_SESSION.id);}catch(_){ }

  return UJI_ACTIVE_SESSION;
