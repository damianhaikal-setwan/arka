<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1b33">
<meta name="description" content="ARKA — Arsitektur Rekam Kinerja dan Administrasi DPRD">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231d4ed8%22/%3E%3Cpath d=%22M18 45 32 15 46 45H37L32 33 27 45Z%22 fill=%22white%22/%3E%3C/svg%3E" type="image/svg+xml">
<title>ARKA – Arsitektur Rekam Kinerja dan Administrasi DPRD</title>
<style>
:root{--bg:#f3f5f9;--surface:#fff;--ink:#1b2535;--muted:#667085;--line:#e3e7ee;--brand:#1d4ed8;--brand2:#0ea5e9;--ok:#12b76a;--warn:#f79009;--bad:#f04438;--side:#0f1b33;--sideTxt:#c3cde2;--r:14px;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06)}
html.dark{--bg:#0b1220;--surface:#131d30;--ink:#e6ecf7;--muted:#8b97ad;--line:#23304a;--side:#070d1a;--sideTxt:#8b97ad;--sh:none}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
#palbtn{display:none}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;transition:.15s}
button:hover{border-color:var(--brand)}
.btn-p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-d{color:var(--bad)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
/* sidebar */
aside{width:250px;background:var(--side);color:var(--sideTxt);position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .2s;flex-shrink:0;z-index:20}
aside .brand{padding:18px;color:#fff;font-weight:800;letter-spacing:.5px;display:flex;gap:10px;align-items:center}
aside .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:16px}
aside h6{margin:14px 18px 4px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55}
aside a{display:block;padding:7px 18px;color:var(--sideTxt);text-decoration:none;border-left:3px solid transparent;font-size:13px}
aside a:hover{background:rgba(255,255,255,.05)}
aside a.on{color:#fff;border-left-color:var(--brand2);background:rgba(14,165,233,.12)}
body.collapsed aside{width:64px}
body.collapsed aside .lbl,body.collapsed aside h6{display:none}
body.collapsed aside a{padding:9px 0;text-align:center;font-size:0}
body.collapsed aside a::first-letter{font-size:13px}
/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 16px}
header .search{flex:1;max-width:460px;position:relative}
header .search input{padding-left:34px}
header .search::before{content:"⌕";position:absolute;left:11px;top:6px;font-size:18px;color:var(--muted)}
.notif{position:relative}
.notif .pop{display:none;position:absolute;right:0;top:44px;width:340px;max-height:420px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:8px;z-index:30}
.notif.open .pop{display:block}
.pop .it{padding:8px;border-bottom:1px solid var(--line);font-size:12.5px}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 6px;margin-left:4px}
.content{padding:20px;display:grid;gap:18px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .n{font-size:26px;font-weight:800}
.kpi .t{color:var(--muted);font-size:12px}
.kpi .d{font-size:11.5px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}aside{position:fixed;left:-260px;transition:left .2s}body.mob.open aside{left:0}}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rowbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:12.5px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input{max-width:260px}
.toolbar select{max-width:170px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);position:sticky;top:0}
tr:hover td{background:rgba(29,78,216,.04)}
.pill{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--line)}
.s-Selesai,.s-Aktif,.s-Tercapai{background:rgba(18,183,106,.16);color:var(--ok)}
.s-Berjalan,.s-Proses{background:rgba(14,165,233,.16);color:var(--brand2)}
.s-Draft,.s-Tertunda{background:rgba(247,144,9,.18);color:var(--warn)}
.s-Terlambat{background:rgba(240,68,56,.16);color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.tnode{margin-left:20px;border-left:2px dashed var(--line);padding-left:12px}
details>summary{list-style:none;cursor:pointer;padding:6px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▾";display:inline-block;width:16px;color:var(--muted)}
details:not([open])>summary::before{content:"▸"}
.tn{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 8px;border-radius:8px;border:1px solid transparent}
.tn:hover{border-color:var(--brand);background:rgba(29,78,216,.06)}
.ng{margin-bottom:2px}
.gh{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-radius:0;color:var(--sideTxt);font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;padding:11px 18px 6px;text-align:left}
.gh:hover{color:#fff;border:0}
.gh .car{opacity:.6;font-size:11px}
.gi a{padding-left:24px}
#navq{margin:12px 14px 4px;width:calc(100% - 28px);background:rgba(255,255,255,.08);border-color:transparent;color:#fff}
#navq::placeholder{color:var(--sideTxt);opacity:.7}
body.collapsed .gh{display:none}
body.collapsed #navq{display:none}
/* Navigasi domain SOTK: modul tetap terpisah secara data, tetapi dapat diakses sebagai panel satu domain */
.domain-shell{display:grid;gap:14px;margin-bottom:2px}
.domain-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.domain-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.domain-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 1px 8px;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.domain-tabs a{display:inline-flex;align-items:center;white-space:nowrap;text-decoration:none;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px}
.domain-tabs a:hover{border-color:var(--brand);color:var(--brand)}
.domain-tabs a.on{background:var(--brand);border-color:var(--brand);color:white}
@media(max-width:700px){.domain-tabs a{padding:7px 9px}.domain-shell{gap:10px}}
/* Kelembagaan DPRD: satu halaman kerja dengan panel domain */
.kl-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.kl-stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.kl-stat .n{font-size:24px;font-weight:750;line-height:1.15;margin:5px 0}
.kl-tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.kl-tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:9px 12px;font-size:12px}
.kl-tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.kl-panel{margin-top:12px;min-width:0}
.kl-intro{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
@media(max-width:700px){.kl-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.kl-stat{padding:10px}.kl-stat .n{font-size:21px}}

/* Navigasi domain berjenjang: kategori utama sedikit, panel detail dikelompokkan */
.kl-category-tabs{margin-top:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.kl-subpanel-tabs{margin:10px 0 14px;gap:5px}
.kl-subpanel-tabs button{font-size:12px;padding:7px 10px}
/* Integrated domain pages v27: panel navigation and embedded module surfaces */
.domain-module-root{min-width:0}
.domain-module-root>.row:first-child{margin-top:0}
.kl-tabs{display:flex;gap:7px;flex-wrap:wrap;align-items:center;overflow-x:auto;padding:4px 0 10px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.kl-tabs button{white-space:nowrap;flex:0 0 auto}
.kl-panel{min-width:0}
@media(max-width:760px){.kl-tabs{flex-wrap:nowrap;white-space:nowrap}.kl-tabs button{font-size:12px;padding:8px 10px}}

/* modal, palette */
.ov{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.modal{background:var(--surface);border-radius:var(--r);width:min(640px,100%);max-height:90vh;overflow:auto;padding:18px;box-shadow:var(--sh)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.pal{width:min(560px,100%);align-self:flex-start;margin-top:12vh;padding:10px}
.pal .opt{padding:9px 10px;border-radius:10px;cursor:pointer}
.pal .opt:hover,.pal .opt.act{background:rgba(29,78,216,.1)}
.hint{font-size:11px;color:var(--muted)}
@media(max-width:700px){.form{grid-template-columns:1fr}.toolbar input,.toolbar select{max-width:none;flex:1}header .search{display:none}#palbtn{display:inline-block}}
@media print{aside,header,.toolbar,.noprint,.actions{display:none!important}main{width:100%}.content{padding:0}body{background:#fff;color:#000}.card,.tbl{border:none;box-shadow:none}}

/* Tabel Tujuan & Sasaran (RPJMD / Renstra) */
.plan-tbl{border-collapse:collapse;width:100%;min-width:1150px;font-size:12.5px;color:#10233f;background:#fff}
.plan-tbl th,.plan-tbl td{border:1px solid #475467;padding:5px 7px;vertical-align:top;text-align:left;position:static}
.plan-tbl th{text-align:center;vertical-align:middle;font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.2px}
.plan-tbl .plan-num td{text-align:center;padding:2px;font-size:11.5px}
.plan-tbl .plan-y{text-align:center;min-width:64px}
.plan-tbl .plan-c1{min-width:150px;max-width:260px}
.plan-ref{margin-top:4px;font-size:11.5px;color:#475467}
.plan-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.plan-title{text-align:center;font-size:15px;margin:8px 0 10px;font-family:Georgia,'Times New Roman',serif}
.plan-tbl input,.plan-tbl textarea,.plan-tbl select{font-size:12.5px;padding:4px 6px;border-radius:6px;background:#fff;color:#10233f;border:1px solid #98a2b3}
.plan-tbl textarea{min-height:44px;resize:vertical}
.plan-tbl .plan-yi{text-align:center;min-width:56px}
.plan-tbl .plan-k{font-weight:700;width:90px;margin-bottom:4px}
.plan-tbl .plan-saved{outline:2px solid var(--ok);background:#ecfdf3}
.plan-tbl .plan-empty{text-align:center;padding:26px;color:#475467}
.plan-tbl .plan-act{white-space:nowrap}
.plan-tbl .plan-act button{padding:3px 8px;font-size:12px}
.plan-tbl tr.plan-s td{background:#fbfcfe}

/* Renja workspace: embedded-safe, hierarchy-first UI */
.rw-shell{display:grid;gap:12px;min-width:0}.rw-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.rw-stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}.rw-stat strong{display:block;font-size:22px;line-height:1.25;margin-top:4px}.rw-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rw-toolbar .grow{flex:1;min-width:230px}.rw-table{overflow:auto;border:1px solid var(--line);border-radius:12px}.rw-table table{min-width:900px}.rw-actions{display:flex;gap:5px;flex-wrap:wrap}.rw-breadcrumb{color:var(--muted);font-size:12px}.rw-warning{border:1px solid rgba(247,144,9,.4);background:rgba(247,144,9,.07);padding:10px 12px;border-radius:10px}.rw-ok{border:1px solid rgba(18,183,106,.35);background:rgba(18,183,106,.06);padding:10px 12px;border-radius:10px}.rw-indent{padding-left:18px;border-left:2px solid var(--line)}.rw-num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.rw-field-note{color:var(--muted);font-size:11px;margin-top:3px}@media(max-width:700px){.rw-toolbar .grow{min-width:100%;flex-basis:100%}.rw-table table{min-width:780px}}

</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('id-ID');
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const TABLES={};          // { modul: [rows] }
const AUDIT=[];           // jejak audit
function dbAll(t){return TABLES[t]||[]}
function ratioPct(n,d){
  if(n===null||n===undefined||n===''||d===null||d===undefined||d==='')return null;
  const numerator=Number(n), denominator=Number(d);
  if(!Number.isFinite(numerator)||!Number.isFinite(denominator)||numerator<0||denominator<=0)return null;
  return numerator/denominator*100;
}
function fmtPct(v,digits=1){return v===null?'—':`${v.toFixed(digits)}%`}
/* Event bus ringan: event domain mengikuti perubahan data, bukan workflow berjenjang. */
const DataEventBus = {
  listeners: new Map(),
  on(eventName, listener) {
    if (typeof listener !== 'function') throw new TypeError('Listener harus berupa fungsi.');
    if (!this.listeners.has(eventName)) this.listeners.set(eventName, new Set());
    this.listeners.get(eventName).add(listener);
    return () => this.listeners.get(eventName)?.delete(listener);
  },
  async emit(eventName, payload={}) {
    const listeners=[...(this.listeners.get(eventName)||[])];
    for (const listener of listeners) {
      try { await listener(payload); }
      catch (error) { console.error(`[ARKA event:${eventName}]`, error); }
    }
  }
};
const NOTIFICATIONS=[];
const hasNumericValue = v => v !== null && v !== undefined && String(v).trim() !== '' && Number.isFinite(Number(v));
function changedKeys(before, after) {
  const keys=new Set([...Object.keys(before||{}),...Object.keys(after||{})]);
  return [...keys].filter(k=>!['_', 'dibuat','diubah','ketua','jumlah'].includes(k) && JSON.stringify(before?.[k]??null)!==JSON.stringify(after?.[k]??null));
}
async function dbSave(t,row){
  if(!t || !row || typeof row!=='object') throw new Error('Record atau modul tidak valid.');
  if(!canWrite(t)) throw new Error('Peran Anda tidak dapat mengubah data modul ini.');
  if(CLOUD && !navigator.onLine) throw new Error('Perangkat sedang offline. Data cloud tidak disimpan; sambungkan jaringan lalu coba kembali.');

  const prior=(dbAll(t)||[]).find(r=>row.id && String(r.id)===String(row.id))||null;
  const isNew=!prior && !row.id;
  const candidate={...(prior||{}),...row};
  if(!candidate.id) candidate.id=uid();
  candidate.dibuat=candidate.dibuat||today();
  candidate.diubah=today();

  // Semua jalur tulis memakai gerbang validasi yang sama, termasuk jalur non-form.
  const validation=(typeof RecordEngine!=='undefined')?RecordEngine.validate(t,candidate):[];
  if(validation.length) throw new Error(validation[0]);
  const hooks=(typeof RecordEngine!=='undefined'&&RecordEngine.hooks)?RecordEngine.hooks.beforeSave:[];
  for(const fn of hooks){
    const result=await Promise.resolve(fn(t,{...candidate},{isNew,before:prior?{...prior}:null}));
    if(result===false) throw new Error('Penyimpanan ditolak oleh hook beforeSave.');
  }

  // Di cloud, trigger audit database harus menyimpan jejak di transaksi yang sama.
  // Cache browser baru diperbarui sesudah server mengonfirmasi upsert.
  if(CLOUD) await arkaWrite(t,candidate,isNew,null,{emitEvent:false});
  const list=TABLES[t]=TABLES[t]||[];
  const index=list.findIndex(r=>String(r.id)===String(candidate.id));
  if(index>=0) list[index]=candidate; else list.push(candidate);

  // Propagasi source-of-truth → relasi → kolom turunan → metrik/alert.
  try { if(typeof RelationEngine!=='undefined') RelationEngine.resolveAll(); } catch(error) { console.error('Relation refresh gagal:',error); }
  try { if(typeof DerivationEngine!=='undefined') DerivationEngine.recomputeAffected(t); } catch(error) { console.error('Derivation refresh gagal:',error); }

  const current=(dbAll(t)||[]).find(r=>String(r.id)===String(candidate.id))||candidate;
  const event={action:isNew?'TAMBAH':'UBAH',module:t,recordId:String(candidate.id),record:{...current},before:prior?{...prior}:null,changedFields:changedKeys(prior,candidate),at:new Date().toISOString(),source:CLOUD?'supabase':'local'};
  await DataEventBus.emit('record:saved',event);

  if(!CLOUD){
    AuditEngine.log(event.action,t,current,{changedFields:event.changedFields,before:event.before,after:{...candidate},source:'local-session'});
  }else if(ARKA_ROLE==='admin'){
    // Kegagalan baca ulang audit tidak membatalkan data yang sudah disimpan.
    AuditEngine.refreshServer().catch(error=>toast('Data tersimpan, tetapi daftar audit belum dapat diperbarui: '+(error.message||error)));
  }
  for(const fn of (typeof RecordEngine!=='undefined'&&RecordEngine.hooks?RecordEngine.hooks.afterSave:[])){
    try { await Promise.resolve(fn(t,{...current},event)); } catch(error) { console.error('afterSave hook gagal:',error); }
  }
  return current;
}
function logAudit(aksi,t,row,userOverride,extra={}){
  if(typeof AuditEngine!=='undefined') return AuditEngine.log(aksi,t,row,{...extra,userOverride:userOverride||undefined});
  if(CLOUD) return null;
  const entry={waktu:new Date().toISOString(),aksi,modul:t,ref:row?.nama||row?.kode||row?.id||'—',user:userOverride||ARKA_NAMA||'Pengguna lokal',...extra};
  AUDIT.unshift(entry); if(AUDIT.length>300)AUDIT.pop(); renderNotif(); return entry;
}

/* ============ ARKA ENGINES (v28.0.1) ============
   Master, Record, Relation (diperkuat) + Derivation, Formula, Metric,
   Evidence, Alert/Monitoring, Analytics, Notification, Audit, Reporting.
   Engine bersifat modul internal; tidak mengubah kontrak data Supabase.
   ============================================== */

const ARKA_ENGINES = {
  version: '28.0.1',
  enabled: true
};

/* ---------- Master Engine ---------- */
const MasterEngine = {
  masters: ['pegawai','anggota','komisi','fraksi','alat','keanggotaan-akd','tenaga','mitra','regulasi'],
  identityFields: {
    pegawai:['nip','nama'], anggota:['nama'], komisi:['kode','nama'], fraksi:['kode','nama'],
    alat:['kode','nama'], 'keanggotaan-akd':['kode','alat','anggota','peran'],
    tenaga:['nama'], mitra:['kode','nama'], regulasi:['kode','nama']
  },
  uniqueFields: {pegawai:['nip'],komisi:['kode'],fraksi:['kode'],alat:['kode'],'keanggotaan-akd':['kode'],mitra:['kode'],regulasi:['kode']},
  isMaster(t) { return this.masters.includes(t); },
  validate(t,row) {
    if(!this.isMaster(t)) return [];
    const errors=[];
    for(const field of (this.identityFields[t]||[])){
      if(row[field]===null||row[field]===undefined||String(row[field]).trim()===''){
        const col=(FIELDS[t]||STD).find(c=>c[0]===field);
        errors.push(`${col?.[1]||field} wajib diisi pada ${LABEL[t]||t}.`);
      }
    }
    for(const field of (this.uniqueFields[t]||[])){
      const value=String(row[field]??'').trim();
      if(!value) continue;
      const key=value.toLocaleLowerCase('id-ID');
      const duplicate=dbAll(t).find(r=>String(r.id)!==String(row.id||'')&&String(r[field]??'').trim().toLocaleLowerCase('id-ID')===key);
      if(duplicate){
        const col=(FIELDS[t]||STD).find(c=>c[0]===field);
        errors.push(`${col?.[1]||field} "${value}" sudah digunakan record lain (${duplicate.nama||duplicate.id}).`);
      }
    }
    return errors;
  },
  ensureIntegrity() {
    const issues=[];
    this.masters.forEach(t=>{
      const rows=dbAll(t), required=this.identityFields[t]||[], unique=this.uniqueFields[t]||[];
      rows.forEach(r=>required.forEach(field=>{
        if(r[field]===null||r[field]===undefined||String(r[field]).trim()===''){
          issues.push({modul:t,id:r.id,field,msg:`Field wajib kosong: ${field}`});
        }
      }));
      unique.forEach(field=>{
        const seen=new Map();
        rows.forEach(r=>{
          const value=String(r[field]??'').trim(); if(!value)return;
          const key=value.toLocaleLowerCase('id-ID');
          if(seen.has(key)) issues.push({modul:t,id:r.id,field,msg:`Nilai unik ganda pada ${field}: ${value}`});
          else seen.set(key,r.id);
        });
      });
    });
    return issues;
  }
};

/* ---------- Record Engine: satu jalur simpan dan hapus ---------- */
const RecordEngine = {
  hooks: { beforeSave: [], afterSave: [], beforeDelete: [], afterDelete: [] },
  registerHook(phase,fn) {
    if(!Object.prototype.hasOwnProperty.call(this.hooks,phase)) throw new Error(`Fase hook tidak dikenal: ${phase}`);
    if(typeof fn!=='function') throw new TypeError('Hook harus berupa fungsi.');
    this.hooks[phase].push(fn);
    return ()=>{this.hooks[phase]=this.hooks[phase].filter(x=>x!==fn);};
  },
  validate(t,row) {
    const errors=[];
    if(MasterEngine.isMaster(t)) errors.push(...MasterEngine.validate(t,row));
    if(typeof validateRecordIntegrity==='function'){
      const err=validateRecordIntegrity(t,row.id,row);
      if(err) errors.push(err);
    }
    return [...new Set(errors)];
  },
  async save(t,row) { return dbSave(t,row); },
  async delete(t,id) {
    if(!canDeleteRecord(t)) throw new Error('Peran Anda tidak memiliki hak untuk menghapus record ini.');
    const row=dbAll(t).find(r=>String(r.id)===String(id));
    if(!row) throw new Error('Record tidak ditemukan.');
    const integrity=RelationEngine.canDelete(t,id);
    if(!integrity.safe) throw new Error('Record masih dirujuk oleh data lain; putuskan relasi secara eksplisit terlebih dahulu.');
    for(const fn of this.hooks.beforeDelete){
      const result=await Promise.resolve(fn(t,{...row}));
      if(result===false) throw new Error('Penghapusan ditolak oleh hook beforeDelete.');
    }
    if(CLOUD) await arkaDelete(t,id);
    TABLES[t]=(TABLES[t]||[]).filter(r=>String(r.id)!==String(id));
    try { RelationEngine.resolveAll(); } catch(error) { console.error('Relation refresh setelah hapus gagal:',error); }
    try { DerivationEngine.recomputeAffected(t); } catch(error) { console.error('Derivation refresh setelah hapus gagal:',error); }
    const event={action:'HAPUS',module:t,recordId:String(id),record:{...row},at:new Date().toISOString(),source:CLOUD?'supabase':'local'};
    await DataEventBus.emit('record:deleted',event);
    if(!CLOUD) AuditEngine.log('HAPUS',t,row,{source:'local-session'});
    else if(ARKA_ROLE==='admin') AuditEngine.refreshServer().catch(error=>toast('Record terhapus, tetapi daftar audit belum dapat diperbarui: '+(error.message||error)));
    for(const fn of this.hooks.afterDelete){try{await Promise.resolve(fn(t,{...row},event));}catch(error){console.error('afterDelete hook gagal:',error);}}
    return row;
  }
};

/* ---------- Relation Engine (diperkuat) ---------- */
const RelationEngine = {
  graph: {},
  buildGraph() {
    const g = {};
    Object.keys(FIELDS).forEach(t => {
      (FIELDS[t]||[]).forEach(([k,,ty,opt]) => {
        if (ty === 'rel' && opt) {
          if (!g[t]) g[t] = [];
          g[t].push({field:k, target:opt});
        }
      });
    });
    this.graph = g;
    return g;
  },
  resolveAll() {
    // panggil resolveRefs asli + deteksi orphan
    resolveRefs();
    return this.findOrphans();
  },
  findOrphans() {
    const orphans = [];
    Object.keys(FIELDS).forEach(t => {
      (FIELDS[t]||[]).forEach(([k,,ty,opt]) => {
        if (ty !== 'rel') return;
        (TABLES[t]||[]).forEach(r => {
          const v = r[k];
          if (v && !dbAll(opt).some(x => String(x.id) === String(v))) {
            orphans.push({modul:t, id:r.id, field:k, value:v, target:opt});
          }
        });
      });
    });
    return orphans;
  },
  canDelete(t, id) {
    // cek apakah masih dirujuk
    const refs = [];
    Object.keys(FIELDS).forEach(src => {
      (FIELDS[src]||[]).forEach(([k,,ty,opt]) => {
        if (ty === 'rel' && opt === t) {
          const found = dbAll(src).filter(r => String(r[k]) === String(id));
          if (found.length) refs.push({modul:src, count:found.length, field:k});
        }
      });
    });
    return {safe: refs.length === 0, refs};
  }
};

/* ---------- Derivation Engine ---------- */
const DerivationEngine = {
  compute(t,row) {
    const cols=FIELDS[t]||STD, out={...row};
    cols.forEach(([k,,ty,opt])=>{
      if(ty==='turunan'){
        const names=turunanRows(opt,row.id).map(m=>turunanDisplayName(opt,m)).filter(Boolean);
        out[k]=names.join(', ')||null;
      }else if(ty==='hit'){
        out[k]=dbAll(opt[0]).filter(x=>String(x[opt[1]]||'')===String(row.id)&&!(opt[2]||[]).includes(x.status)).length;
      }
    });
    return out;
  },
  recomputeAll(t) {
    (TABLES[t]||[]).forEach((r,i)=>{TABLES[t][i]=this.compute(t,r);});
    return TABLES[t]||[];
  },
  derivedModulesFor(sourceModule) {
    return Object.keys(FIELDS).filter(target=>(FIELDS[target]||[]).some(([, ,ty,opt])=>
      (ty==='hit'||ty==='turunan')&&Array.isArray(opt)&&String(opt[0])===String(sourceModule)
    ));
  },
  recomputeAffected(sourceModule) {
    // Derived fields may live on a different table than the record being edited.
    // Example: perubahan Anggota DPRD menghitung ulang ketua/jumlah di Fraksi dan Komisi.
    const targets=new Set([sourceModule,...this.derivedModulesFor(sourceModule)]);
    targets.forEach(t=>this.recomputeAll(t));
    return [...targets];
  },
  recomputeLoaded() {
    Object.keys(FIELDS).filter(t=>(FIELDS[t]||[]).some(c=>c[2]==='hit'||c[2]==='turunan')).forEach(t=>this.recomputeAll(t));
  }
};

/* ---------- Formula Engine ---------- */
const FormulaEngine = {
  registry: {
    ratioPct,
    serapan: (rows,paguKey='pagu',realKey='realisasi')=>{
      const valid=(rows||[]).filter(r=>hasNumericValue(r[paguKey])&&Number(r[paguKey])>0&&hasNumericValue(r[realKey])&&Number(r[realKey])>=0);
      if(!valid.length)return null;
      const pagu=valid.reduce((a,r)=>a+Number(r[paguKey]),0);
      const realisasi=valid.reduce((a,r)=>a+Number(r[realKey]),0);
      return ratioPct(realisasi,pagu);
    },
    avgRatio: (rows,numKey,denKey)=>{
      const vals=(rows||[]).map(r=>ratioPct(r[numKey],r[denKey])).filter(v=>v!==null);
      return vals.length?vals.reduce((a,v)=>a+v,0)/vals.length:null;
    },
    countByStatus: (rows,status,key='status')=>(rows||[]).filter(r=>r[key]===status).length,
    validRatioRows: (rows,numKey,denKey)=>(rows||[]).filter(r=>ratioPct(r[numKey],r[denKey])!==null).length,
    validSerapanRows: (rows,paguKey='pagu',realKey='realisasi')=>(rows||[]).filter(r=>hasNumericValue(r[paguKey])&&Number(r[paguKey])>0&&hasNumericValue(r[realKey])&&Number(r[realKey])>=0).length
  },
  eval(name,...args){const fn=this.registry[name];return fn?fn(...args):null;},
  register(name,fn){if(typeof fn!=='function')throw new TypeError('Formula harus berupa fungsi.');this.registry[name]=fn;}
};

/* ---------- Metric Engine ---------- */
const MetricEngine = {

  definitions:[
    {id:'pegawai_aktif',label:'Pegawai Aktif',unit:'count',source:'pegawai',fn:()=>dbAll('pegawai').filter(r=>r.status==='Aktif').length},

    {id:'spj_terlambat',label:'SPJ Terlambat',unit:'count',source:'spj',fn:()=>dbAll('spj').filter(r=>r.status==='Terlambat').length},

  ],

  computeAll(){

      const total=d.source?dbAll(d.source).length:null;
      return {...d,value,formatted,validCount,total,excludedCount:validCount===null||total===null?null:Math.max(0,total-validCount),error,revision:this.revision};

};

/* ---------- Evidence Engine: relasi nyata, bukan tautan semu ---------- */
const EvidenceEngine = {
  async link({evidenceId,targetType,targetId,relationType='mendukung',indicatorId=null,sasaranId=null,period=null}={}){
    if(!CLOUD||!sb)throw new Error('Evidence persisten hanya tersedia pada mode Supabase; mode lokal tidak dapat memverifikasi bukti.');
    const schema=await ensureEvidenceSchema();
    if(!schema.available)throw new Error(arkaEvidenceSchemaMessage(schema));
    if(!evidenceId||!targetType||!targetId)throw new Error('Evidence, jenis target, dan record target wajib dipilih.');
    if((indicatorId||sasaranId)&&!String(period||'').trim())throw new Error('Periode wajib diisi untuk tautan pendukung IKU/Sasaran.');
    const {data,error}=await sb.rpc('arka_evidence_link_create_v27',{
      p_evidence_id:evidenceId,p_target_type:arkaTn(targetType),p_target_id:String(targetId),
      p_relation_type:relationType,p_indikator_id:indicatorId||null,p_sasaran_id:sasaranId||null,p_periode:String(period||'').trim()||null
    });
    if(error)throw error;
    await DataEventBus.emit('evidence:changed',{action:'LINK',evidenceId,targetType,targetId,at:new Date().toISOString()});
    if(ARKA_ROLE==='admin')AuditEngine.refreshServer().catch(()=>{});
    return data;
  },
  async coverageFor(moduleId){
    const total=dbAll(moduleId).length;
    if(!CLOUD||!sb)return {moduleId,total,linked:null,verified:null,pct:null,status:'Tidak dapat diverifikasi dalam mode lokal'};
    const schema=await ensureEvidenceSchema();
    if(!schema.available)return {moduleId,total,linked:null,verified:null,pct:null,status:'Tidak dapat diverifikasi',error:arkaEvidenceSchemaMessage(schema)};
    const targetType=arkaTn(moduleId);
    const [itemsResult,linksResult]=await Promise.all([
      sb.from('evidence_item').select('id,status_verifikasi'),
      sb.from('evidence_link').select('id,evidence_id,target_type,target_id,indikator_id,sasaran_id,periode,relation_type').eq('target_type',targetType)
    ]);
    if(itemsResult.error)throw itemsResult.error;if(linksResult.error)throw linksResult.error;
    const evidenceById=new Map((itemsResult.data||[]).map(e=>[String(e.id),e]));
    const valid=(linksResult.data||[]).filter(link=>evidenceTargetLookup(link).exists&&link.relation_type!=='berasal_dari'&&((!link.indikator_id&&!link.sasaran_id)||String(link.periode||'').trim()!==''));
    const linkedTargets=new Set(valid.map(link=>String(link.target_id)));
    const verifiedTargets=new Set(valid.filter(link=>evidenceById.get(String(link.evidence_id))?.status_verifikasi==='terverifikasi').map(link=>String(link.target_id)));
    const linked=[...linkedTargets].filter(id=>dbAll(moduleId).some(r=>String(r.id)===id)).length;
    const verified=[...verifiedTargets].filter(id=>dbAll(moduleId).some(r=>String(r.id)===id)).length;
    return {moduleId,total,linked,verified,pct:total?Math.round(verified/total*100):0,status:'Data server terbaca; bukan skor SAKIP resmi'};
  }
};

/* ---------- Alert / Monitoring Engine ---------- */
const AlertEngine = {
  rules:[
    {id:'realisasi_gt_pagu',severity:'warn',check:()=>{
      const bad=[];
      ['program','anggaran'].forEach(t=>dbAll(t).forEach(r=>{
        if(hasNumericValue(r.pagu)&&hasNumericValue(r.realisasi)&&Number(r.pagu)>0&&Number(r.realisasi)>Number(r.pagu))bad.push({modul:t,id:r.id,nama:r.nama||r.kode});
      }));
      return bad;
    }},
    {id:'spj_terlambat',severity:'bad',check:()=>dbAll('spj').filter(r=>r.status==='Terlambat').map(r=>({modul:'spj',id:r.id,nama:r.nama||r.kode}))},
    {id:'rencanaaksi_terlambat',severity:'warn',check:()=>dbAll('rencanaaksi').filter(r=>r.status==='Terlambat').map(r=>({modul:'rencanaaksi',id:r.id,nama:r.nama||r.kode}))},
    {id:'orphan_rel',severity:'info',check:()=>RelationEngine.findOrphans().slice(0,20)}
  ],
  activeFingerprints:new Set(),
  prime(){
    const existing=new Set();
    this.scan().forEach(a=>a.items.forEach(item=>existing.add([a.id,item.modul||'',item.id||item.field||item.value||item.nama||''].join('|'))));
    this.activeFingerprints=existing;
    return existing.size;
  },
  scan(){
    const alerts=[];
    this.rules.forEach(rule=>{try{const items=rule.check()||[];if(items.length)alerts.push({id:rule.id,severity:rule.severity,count:items.length,items:items.slice(0,10)});}catch(error){console.error('Alert rule gagal:',rule.id,error);}});
    return alerts;
  },
  observeChanges(event={}){
    const alerts=this.scan(), next=new Set(), newly=[];
    alerts.forEach(a=>a.items.forEach(item=>{
      const fingerprint=[a.id,item.modul||'',item.id||item.field||item.value||item.nama||''].join('|');
      next.add(fingerprint);
      if(!this.activeFingerprints.has(fingerprint))newly.push({alert:a,item,fingerprint});
    }));
    this.activeFingerprints=next;
    newly.forEach(({alert,item})=>NotificationEngine.push(`${alert.id}: ${item.nama||item.value||item.id||'item'} (${alert.severity})` ,alert.severity==='bad'?'alert':'info',{source:'AlertEngine',fingerprint:[alert.id,item.modul||'',item.id||item.field||item.value||item.nama||''].join('|')}));
    return {active:alerts.reduce((n,a)=>n+a.count,0),newCount:newly.length,alerts,event};
  },
  summary(){const all=this.scan();return {total:all.reduce((a,x)=>a+x.count,0),bySeverity:all.reduce((o,x)=>{o[x.severity]=(o[x.severity]||0)+x.count;return o;},{})};}
};

/* ---------- Notification Engine: dipisahkan dari audit trail ---------- */
const NotificationEngine = {
  push(msg,type='info',meta={}){
    const fingerprint=meta.fingerprint||`${type}|${String(msg)}`;
    if(NOTIFICATIONS.some(n=>n.fingerprint===fingerprint&&n.type===type))return null;
    const entry={waktu:new Date().toISOString(),aksi:type.toUpperCase(),modul:'notif',ref:String(msg),user:ARKA_NAMA||'Sistem',type,fingerprint,source:meta.source||'system'};
    NOTIFICATIONS.unshift(entry);if(NOTIFICATIONS.length>100)NOTIFICATIONS.pop();
    renderNotif();if(type==='alert')toast(msg);return entry;
  },
  fromAlerts(){
    const result=AlertEngine.observeChanges({source:'manual-scan'});
    this.push(`Pemeriksaan selesai: ${result.active} alert aktif, ${result.newCount} baru`,'info',{source:'AlertEngine',fingerprint:`scan|${today()}|${result.active}|${result.newCount}`});
    return result;
  }
};

/* ---------- Audit Engine ---------- */
let auditRefreshQueued=false;
const AuditEngine = {
  log(aksi,modul,row,extra={}){
    const entry={waktu:new Date().toISOString(),aksi,modul,ref:row?.nama||row?.kode||row?.id||'—',user:extra.userOverride||ARKA_NAMA||(CLOUD?'Pengguna terautentikasi':'Pengguna lokal'),extra:{...extra}};
    if(CLOUD){
      // Audit data cloud berasal dari trigger/RPC server. Jangan menambahkan salinan browser
      // yang seolah-olah merupakan audit permanen.
      if(ARKA_ROLE==='admin') this.scheduleServerRefresh();
      return {...entry,persistence:'server-owned'};
    }
    AUDIT.unshift(entry);if(AUDIT.length>300)AUDIT.pop();renderNotif();return {...entry,persistence:'local-session'};
  },
  scheduleServerRefresh(){
    if(auditRefreshQueued||!CLOUD||ARKA_ROLE!=='admin')return;
    auditRefreshQueued=true;
    Promise.resolve().then(async()=>{
      try{await arkaLoadAudit();}
      catch(error){NotificationEngine.push('Audit server belum dapat diperbarui: '+(error.message||error),'warn',{source:'AuditEngine',fingerprint:'audit-refresh-error'});}
      finally{auditRefreshQueued=false;}
    });
  },
  async refreshServer(){if(!CLOUD||ARKA_ROLE!=='admin')return [];await arkaLoadAudit();return AUDIT;},
  query(filter={}){return AUDIT.filter(a=>(!filter.modul||a.modul===filter.modul)&&(!filter.aksi||a.aksi===filter.aksi));},
  exportCsv(){
    if(CLOUD&&ARKA_ROLE!=='admin'){toast('Ekspor audit server hanya tersedia untuk administrator yang berwenang.');return;}
    const rows=this.query().map(a=>[a.waktu,a.aksi,a.modul,a.ref,a.user].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
    const blob=new Blob(['\uFEFF'+['Waktu,Aksi,Modul,Ref,User',...rows].join('\r\n')],{type:'text/csv;charset=utf-8'});

};

/* ---------- Reporting Engine: hasil ringkas dan gerbang kesiapan SAKIP ---------- */
const ReportingEngine = {
  csv(t,rows=null){
    const data=rows||dbAll(t),cols=(FIELDS[t]||STD).map(c=>c[0]),heads=(FIELDS[t]||STD).map(c=>c[1]||c[0]);
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const lines=[heads.map(q).join(',')];data.forEach(r=>lines.push(cols.map(k=>q(exportFieldValue(t,r,(FIELDS[t]||STD).find(c=>c[0]===k)||[k,'',null]))).join(',')));
    const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ARKA_${t}_${today()}.csv`;a.click();
    AuditEngine.log('EXPORT_CSV',t,{nama:`${data.length} baris`},{source:'user-action'});
  },
  readinessSnapshot(evidenceState={status:'belum diperiksa',verifiedIndicatorIds:new Set(),validTargetLinkCount:null}){
    const indicators=[...dbAll('iku').map(r=>({...r,jenis:'IKU'})),...dbAll('iki').map(r=>({...r,jenis:'IKI'}))];
    const rows=indicators.map(r=>{
      const targetOk=hasNumericValue(r.target)&&Number(r.target)>0;
      const actualOk=hasNumericValue(r.capaian)&&Number(r.capaian)>=0;
      const nameOk=String(r.nama||'').trim()!=='';
      const unitOk=r.jenis==='IKU'?String(r.satuan||'').trim()!=='':false;
      const periodModeled=Object.prototype.hasOwnProperty.call(r,'periode');
      const verified=r.jenis==='IKU'&&evidenceState.verifiedIndicatorIds instanceof Set&&evidenceState.verifiedIndicatorIds.has(String(r.id));
      return {...r,targetOk,actualOk,nameOk,unitOk,periodModeled,verified,ratio:targetOk&&actualOk?ratioPct(r.capaian,r.target):null};
    });
    const validNumbers=rows.filter(r=>r.targetOk&&r.actualOk).length;
    const evidenceEligibleCount=rows.filter(r=>r.jenis==='IKU').length;
    const withVerified=rows.filter(r=>r.jenis==='IKU'&&r.verified).length;
    const structuralGaps=[
      'Periode pelaporan belum menjadi field pada model IKU/IKI; angka lintas periode tidak boleh dianggap satu periode.',
      'IKI belum memiliki satuan yang terstruktur pada formulir/model.',
      'Definisi operasional, arah capaian, formula berversi, sumber data dan pemilik indikator belum lengkap pada model.',
      'Evidence link saat ini mereferensikan indikator pada IKU; dukungan bukti IKI belum tercakup dalam kontrak saat ini.'
    ];
    if(evidenceState.status!=='berhasil dibaca')structuralGaps.push('Status Evidence belum dapat diverifikasi dari tabel server; ketiadaan akses tidak boleh ditafsirkan sebagai bukti tidak ada atau bukti valid.');
    return {rows,indicatorCount:rows.length,validNumbers,withVerified,evidenceEligibleCount,evidenceStatus:evidenceState.status,validTargetLinkCount:evidenceState.validTargetLinkCount,gaps:structuralGaps,finalReady:false};
  },
  async summaryReport(){
    // Buka jendela pada gestur tombol untuk menghindari pemblokir pop-up setelah query async.
    const w=window.open('','_blank');if(!w){toast('Laporan diblokir browser. Izinkan pop-up untuk ARKA lalu ulangi.');return null;}
    w.document.write('<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Memuat laporan ARKA</title></head><body style="font:14px system-ui;padding:24px">Memeriksa data sumber dan hubungan Evidence…</body></html>');
    let evidenceState={status:'tidak dapat diverifikasi',verifiedIndicatorIds:new Set(),validTargetLinkCount:null};
    if(CLOUD){
      const evidenceSchema=await ensureEvidenceSchema();
      if(!evidenceSchema.available){
        evidenceState={status:'skema Evidence tidak tersedia',verifiedIndicatorIds:new Set(),validTargetLinkCount:null,error:arkaEvidenceSchemaMessage(evidenceSchema)};
      }else try{
        const [itemsResult,linksResult]=await Promise.all([
          sb.from('evidence_item').select('id,status_verifikasi'),
          sb.from('evidence_link').select('id,evidence_id,target_type,target_id,relation_type,indikator_id,sasaran_id,periode')
        ]);
        if(itemsResult.error)throw itemsResult.error;if(linksResult.error)throw linksResult.error;
        const itemMap=new Map((itemsResult.data||[]).map(e=>[String(e.id),e]));
        const links=linksResult.data||[];
        const validLinks=links.filter(l=>evidenceTargetLookup(l).exists);
        const supporting=validLinks.filter(l=>l.relation_type!=='berasal_dari'&&((!l.indikator_id&&!l.sasaran_id)||String(l.periode||'').trim()!==''));
        const verifiedIndicatorIds=new Set();
        supporting.forEach(link=>{
          if(itemMap.get(String(link.evidence_id))?.status_verifikasi!=='terverifikasi')return;
          if(link.indikator_id&&dbAll('iku').some(i=>String(i.id)===String(link.indikator_id)))verifiedIndicatorIds.add(String(link.indikator_id));
          if(link.sasaran_id){
            const goal=dbAll('sasaran').find(s=>String(s.id)===String(link.sasaran_id));
            if(goal?.iku&&dbAll('iku').some(i=>String(i.id)===String(goal.iku)))verifiedIndicatorIds.add(String(goal.iku));
          }
        });
        evidenceState={status:'berhasil dibaca',verifiedIndicatorIds,validTargetLinkCount:validLinks.length};
      }catch(error){evidenceState={status:'tidak dapat diverifikasi',verifiedIndicatorIds:new Set(),validTargetLinkCount:null,error:error.message||String(error)};}
    }else evidenceState.status='mode lokal; bukti server tidak tersedia';

    const metrics=MetricEngine.computeAll(),alerts=AlertEngine.summary(),snapshot=this.readinessSnapshot(evidenceState);
    const escHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const metricRows=metrics.map(m=>`<tr><td>${escHtml(m.label)}</td><td>${escHtml(m.formatted)}</td><td>${escHtml(m.validCount===null||m.total===null?'—':`${m.validCount}/${m.total}`)}</td><td>${escHtml(m.note||'')}</td></tr>`).join('');
    const indicatorRows=snapshot.rows.map(r=>`<tr><td>${escHtml(r.jenis)}</td><td>${escHtml(r.kode||r.id||'—')} · ${escHtml(r.nama||'')}</td><td>${escHtml(r.target??'—')}</td><td>${escHtml(r.capaian??'—')}</td><td>${r.ratio===null?'—':escHtml(fmtPct(r.ratio))}</td><td>${r.jenis==='IKI'?'Relasi bukti IKI belum dimodelkan':r.verified?'Evidence terverifikasi':evidenceState.status==='berhasil dibaca'?'Belum ditemukan bukti terverifikasi yang cocok':'Tidak dapat diverifikasi'}</td></tr>`).join('');
    const gaps=snapshot.gaps.map(g=>`<li>${escHtml(g)}</li>`).join('');
    const report=`<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKA — Pemeriksaan Kesiapan Pelaporan Kinerja</title><style>body{font:14px/1.55 system-ui,sans-serif;color:#1b2535;max-width:1100px;margin:0 auto;padding:28px}h1{font-size:24px}h2{font-size:18px;margin-top:28px}table{width:100%;border-collapse:collapse;margin:12px 0 20px}th,td{border:1px solid #d9e0e9;padding:8px;text-align:left;vertical-align:top}th{background:#f2f4f7}.notice{border-left:4px solid #f79009;padding:12px 14px;background:#fff7e6}.sub{color:#667085;font-size:12px}.no-print{margin-bottom:16px}@media print{.no-print{display:none}body{padding:0}}</style></head><body><div class="no-print"><button onclick="window.print()">Cetak / Simpan PDF</button></div><h1>Pemeriksaan Kesiapan Pelaporan Kinerja ARKA</h1><div class="sub">Dibuat: ${escHtml(new Date().toLocaleString('id-ID'))} · ARKA ${ARKA_APP_VERSION}</div><div class="notice"><b>STATUS: BELUM LAYAK DINYATAKAN SEBAGAI LAPORAN SAKIP FINAL</b><p>Laporan ini adalah pemeriksaan kesiapan dan ringkasan data yang termuat. Tidak menyatakan nilai evaluasi SAKIP resmi atau kepatuhan hukum. Data target/realisasi masih perlu diverifikasi berdasarkan definisi, periode, sumber, bukti dan kewenangan reviewer.</p></div><h2>1. Ringkasan metrik operasional</h2><table><thead><tr><th>Metrik</th><th>Nilai</th><th>Record valid/total</th><th>Batas interpretasi</th></tr></thead><tbody>${metricRows}</tbody></table><h2>2. Pemeriksaan IKU/IKI</h2><p>Indikator terdeteksi: ${snapshot.indicatorCount}; dengan target positif dan realisasi numerik: ${snapshot.validNumbers}; IKU dengan Evidence terverifikasi yang dapat dicocokkan: ${snapshot.withVerified}/${snapshot.evidenceEligibleCount}. IKI tidak masuk denominator evidence karena relasi bukti IKI belum dimodelkan. Status baca Evidence: ${escHtml(evidenceState.status)}.</p><table><thead><tr><th>Jenis</th><th>Indikator</th><th>Target</th><th>Realisasi</th><th>Rasio aritmetis</th><th>Status evidence</th></tr></thead><tbody>${indicatorRows||'<tr><td colspan="6">Belum ada indikator.</td></tr>'}</tbody></table><h2>3. Gerbang mutu yang belum dipenuhi</h2><ul>${gaps}</ul><h2>4. Monitoring dan alert</h2><p>Total temuan monitoring/alert aktif menurut aturan aplikasi: ${alerts.total}. Angka ini merupakan alarm operasional, bukan temuan audit resmi.</p><h2>5. Batas dan tindak lanjut</h2><p>Sebelum laporan kinerja disahkan, tetapkan periode pelaporan dan versi target; lengkapi definisi indikator; pastikan sumber realisasi; validasi relasi serta bukti oleh pejabat berwenang; lakukan reviu; dan simpan versi laporan beserta waktu serta penanggung jawab. Jangan menjumlahkan pagu bertingkat Program–Kegiatan–Subkegiatan sebagai total yang sama.</p></body></html>`;
    w.document.open();w.document.write(report);w.document.close();
    AuditEngine.log('GENERATE_READINESS_REPORT','kinerja',{nama:'Pemeriksaan kesiapan pelaporan kinerja'},{source:'user-action'});
    return snapshot;
  }
};

      'program','kegiatan','subkegiatan','sasaran','iku','iki','rpjmd','renstra','renja','cascading','pohon','perjanjian','rencanaaksi','ikuk','ikik','monitoring','evaluasi','an-sakip','an-keu','an-legis','an-awas','an-aspirasi','an-puas']);
    const items=g.items.filter(([id,l])=>(q||!hiddenInSidebar.has(id))&&(!q||(l+' '+g.g).toLowerCase().includes(q))&&(!isDataMod(id)||canRead(id)));
    if(!items.length)return '';
    const open=navIsOpen(gi,items,cur);
    return `<div class="ng"><button class="gh" onclick="toggleG(${gi})"><span class="gt">${esc(g.g)}</span><span class="car">${open?'▾':'▸'}</span></button>`+
      (open?`<div class="gi">${items.map(([id,l])=>`<a href="#${id}" class="${id===cur?'on':''}" title="${esc(l)}"><span class="lbl">${esc(l)}</span></a>`).join('')}</div>`:'')+`</div>`;
  }).join('');
}
function toggleG(gi){
  const g=MENU[gi], cur=location.hash.slice(1)||'dash';
  const hiddenInSidebar=new Set(['anggota','komisi','fraksi','alat','keanggotaan-akd',
      'agenda','jadwal','rapat','rapat-komisi','banggar','bapemperda','bk','paripurna','risalah','notulen','keputusan','propemperda','ranperda','naskahakademik','dim','harmonisasi','jdih','regulasi','berita','publikasi','dokumentasi','mediamon','protokoler',
      'kua','ppas','apbd','apbdp','lapsemester','pertanggungjawaban','monopd','monprogram','monproyek','lkpj','temuan','rekomendasi','tindaklanjut','reses','pokir','hearing','audiensi','aspirasidigital','pengaduan',
      'program','kegiatan','subkegiatan','sasaran','iku','iki','rpjmd','renstra','renja','cascading','pohon','perjanjian','rencanaaksi','ikuk','ikik','monitoring','evaluasi','an-sakip','an-keu','an-legis','an-awas','an-aspirasi','an-puas']);
  const items=g.items.filter(([id,l])=>(NAVQ.trim()||!hiddenInSidebar.has(id))&&(!NAVQ.trim()||(l+' '+g.g).toLowerCase().includes(NAVQ.trim().toLowerCase()))&&(!isDataMod(id)||canRead(id)));
  NAVST[gi]=!navIsOpen(gi,items,cur);

function go(){
  const id=location.hash.slice(1)||'dash';
  renderNav();
  if(id==='dash')return renderDash();
  if(id==='kelembagaan')return renderKelembagaan();
  if(['program','kegiatan','subkegiatan'].includes(id)){RENJA_WORKSPACE_TAB=id;location.hash='#renja';return renderRenjaWorkspace(id);}
  if(['anggota','komisi','fraksi','alat','keanggotaan-akd'].includes(id)){KELEMBAGAAN_PANEL=id;location.hash='#kelembagaan';return renderKelembagaan(id);}
  if(typeof INTEGRATED_DOMAINS!=='undefined'){
    if(INTEGRATED_DOMAINS[id])return renderIntegratedDomain(id);
    for(const [domain,cfg] of Object.entries(INTEGRATED_DOMAINS)){
      if(cfg.panels.some(panel=>panel[0]===id)){INTEGRATED_PANEL[domain]=id;location.hash='#'+domain;return renderIntegratedDomain(domain,id);}
    }
  }
  if(id==='evidence')return renderEvidence();
  if(id==='panduan')return renderPanduan();
  if(id==='periksa')return renderPeriksa();
  if(id==='uji')return renderUji();
  if(id==='pengguna')return renderPengguna();
  if(id.startsWith('an-'))return renderAnalytics(id);
  renderModule(id);
}

function runKinerjaIntegrityCheck(){

 checkModules.forEach(t=>{
  const issues=auditModule(t);
  issues.forEach(i=>out.push({modul:LABEL[t]||t,...i}));
 });
 // Kontrak gaps are intentionally separated from data errors: HTML must not pretend that
 // absent database fields exist or submit them to Supabase before migration is designed.

  {tingkat:'Kontrak',modul:'Program–Anggaran–SPJ',ref:'Model data',kol:'Tahun/periode & revisi pagu',pesan:'Tahun/periode dan histori revisi pagu belum dimodelkan pada rantai Program → Kegiatan → Subkegiatan → Anggaran → SPJ. Perbandingan agregat saat ini hanya anomali awal; jangan satukan lintas tahun atau nyatakan pelanggaran tanpa verifikasi.'},
  {tingkat:'Kontrak',modul:'IKU/IKI',ref:'Model indikator',kol:'Periode, satuan, arah & rumus',pesan:'IKU belum memiliki periode pelaporan terstruktur; IKI belum memiliki periode dan satuan di formulir/model. Arah capaian, definisi/rumus, sumber data, serta pemilik yang bertanggung jawab juga perlu dikunci sebelum KPI dinyatakan resmi.'},
  {tingkat:'Kontrak',modul:'Evidence Engine',ref:'Relasi indikator',kol:'IKI dan verifikasi',pesan:'evidence_link.indikator_id saat ini mereferensikan IKU, bukan IKI. Kontrak harus menetapkan bagaimana bukti IKI ditautkan serta siapa yang berwenang memverifikasi; status terverifikasi tidak boleh disimpulkan dari lampiran saja.'}
 );
 const box=$('#kinerjaIntegrityResults');if(!box)return;
 const critical=out.filter(x=>x.tingkat==='Kritis').length, warnings=out.filter(x=>x.tingkat==='Peringatan').length, contracts=out.filter(x=>x.tingkat==='Kontrak').length;
 if(!out.length){box.innerHTML='<div class="hint">Tidak ditemukan masalah berdasarkan aturan relasi dan validasi yang tersedia. Ini bukan pengesahan isi substantif atau validasi resmi SAKIP.</div>';return;}

}

function renjaValidation(doc){
  const issues=[];const p=renjaForDoc('program',doc.id),k=renjaForDoc('kegiatan',doc.id),sk=renjaForDoc('subkegiatan',doc.id);
  p.forEach(x=>{if(Number(x.tahun)!==Number(doc.tahun))issues.push({level:'error',text:`Program ${x.kode||x.nama}: tahun berbeda dari dokumen Renja.`});if(!x.nama||!x.kode)issues.push({level:'error',text:`Program dengan ID ${x.id} belum memiliki kode/nama lengkap.`});});
  k.forEach(x=>{const par=dbAll('program').find(y=>String(y.id)===String(x.program));if(!par)issues.push({level:'error',text:`Kegiatan ${x.kode||x.nama}: Program induk tidak ditemukan.`});else if(String(par.renjaRef||'')!==String(doc.id))issues.push({level:'error',text:`Kegiatan ${x.kode||x.nama}: Program induk berasal dari Renja lain.`});if(Number(x.tahun)!==Number(doc.tahun))issues.push({level:'error',text:`Kegiatan ${x.kode||x.nama}: tahun berbeda dari dokumen Renja.`});});
  sk.forEach(x=>{const par=dbAll('kegiatan').find(y=>String(y.id)===String(x.kegiatan));if(!par)issues.push({level:'error',text:`Subkegiatan ${x.kode||x.nama}: Kegiatan induk tidak ditemukan.`});else {if(String(par.renjaRef||'')!==String(doc.id))issues.push({level:'error',text:`Subkegiatan ${x.kode||x.nama}: Kegiatan induk berasal dari Renja lain.`});if(String(par.program||'')&&!dbAll('program').some(y=>String(y.id)===String(par.program)&&String(y.renjaRef||'')===String(doc.id)))issues.push({level:'error',text:`Subkegiatan ${x.kode||x.nama}: rantai Program → Kegiatan tidak konsisten.`});}if(Number(x.tahun)!==Number(doc.tahun))issues.push({level:'error',text:`Subkegiatan ${x.kode||x.nama}: tahun berbeda dari dokumen Renja.`});});
  const currentProgramIds=new Set(p.map(x=>String(x.id))), currentActivityIds=new Set(k.map(x=>String(x.id)));
  dbAll('kegiatan').filter(x=>currentProgramIds.has(String(x.program||''))&&String(x.renjaRef||'')!==String(doc.id)).forEach(x=>issues.push({level:'error',text:`Kegiatan ${x.kode||x.nama} menunjuk Program pada Renja ini tetapi referensi dokumennya berbeda/kosong.`}));
  dbAll('subkegiatan').filter(x=>currentActivityIds.has(String(x.kegiatan||''))&&String(x.renjaRef||'')!==String(doc.id)).forEach(x=>issues.push({level:'error',text:`Subkegiatan ${x.kode||x.nama} menunjuk Kegiatan pada Renja ini tetapi referensi dokumennya berbeda/kosong.`}));
  p.forEach(x=>{const children=k.filter(y=>String(y.program)===String(x.id));if(children.length&&x.pagu!==''&&x.pagu!==null&&x.pagu!==undefined){const childTotal=children.reduce((a,y)=>a+(Number(y.pagu)||0),0);if(Math.abs(childTotal-(Number(x.pagu)||0))>0.5)issues.push({level:'warning',text:`Pagu Program ${x.kode||x.nama} (${renjaMoney(x.pagu)}) berbeda dari jumlah pagu Kegiatan langsung (${renjaMoney(childTotal)}). Periksa apakah nilai Program merupakan subtotal atau alokasi langsung.`});}});
  k.forEach(x=>{const children=sk.filter(y=>String(y.kegiatan)===String(x.id));if(children.length&&x.pagu!==''&&x.pagu!==null&&x.pagu!==undefined){const childTotal=children.reduce((a,y)=>a+(Number(y.pagu)||0),0);if(Math.abs(childTotal-(Number(x.pagu)||0))>0.5)issues.push({level:'warning',text:`Pagu Kegiatan ${x.kode||x.nama} (${renjaMoney(x.pagu)}) berbeda dari jumlah pagu Subkegiatan langsung (${renjaMoney(childTotal)}). Periksa subtotal/alokasi langsung.`});}});
  const completeness=[...p.map(r=>({t:'Program',r,hasChildren:k.some(x=>String(x.program)===String(r.id))})),...k.map(r=>({t:'Kegiatan',r,hasChildren:sk.some(x=>String(x.kegiatan)===String(r.id))})),...sk.map(r=>({t:'Subkegiatan',r,hasChildren:false}))];
  completeness.forEach(({t,r,hasChildren})=>{
    if(!String(r.indikator||'').trim())issues.push({level:'warning',text:`${t} ${r.kode||r.nama}: indikator belum diisi.`});
    if(!String(r.target||'').trim())issues.push({level:'warning',text:`${t} ${r.kode||r.nama}: target tahunan belum diisi.`});
    if(!hasChildren){

function renjaBudgetLeaves(doc){

const TREES={pohon:'Pohon Kinerja',cascading:'Cascading Sasaran'};
function buildTree(id){
  if(id==='pohon'){
    const all=dbAll('pohon');
    return{
      roots:all.filter(x=>!x.induk||!all.some(y=>y.id===x.induk)),
      kids:n=>all.filter(x=>x.induk===n.id),
      render:n=>`<span class="tn" onclick="event.preventDefault();event.stopPropagation();openForm('pohon','${n.id}')"><span class="pill s-${esc(n.status)}">${esc(n.level)}</span><b>${esc(n.kode)}</b>&nbsp;${esc(n.nama)}</span>`
    };
  }
  const cas=dbAll('cascading'), sas=dbAll('sasaran');
  const src=new Set(cas.map(c=>c.sumber)), tgt=new Set(cas.map(c=>c.tujuan));
  return{
    roots:sas.filter(s=>src.has(s.id)&&!tgt.has(s.id)),
    kids:n=>cas.filter(c=>c.sumber===n.id).map(c=>sas.find(s=>s.id===c.tujuan)).filter(Boolean),
    render:n=>{
      const ik=dbAll('iku').find(x=>x.id===n.iku);
      return `<span class="tn" onclick="event.preventDefault();event.stopPropagation();openForm('sasaran','${n.id}')"><b>${esc(n.kode)}</b>&nbsp;${esc(n.nama)}${ik?` <span class="sub">· ${esc(ik.kode)}</span>`:''}</span>`;
    }
  };
}
function treeHTML(nodes,b,seen){
  return nodes.map(n=>{
    if(seen.has(n.id))return '';
    seen.add(n.id);
    return `<details open><summary>${b.render(n)}</summary><div class="tnode">${treeHTML(b.kids(n),b,seen)}</div></details>`;
  }).join('');
}
function renderTree(id){
  const b=buildTree(id), html=treeHTML(b.roots,b,new Set())||'<div class="empty">Belum ada hubungan induk–anak.</div>';
  const el=document.createElement('div');
  el.className='card';el.id='tree';
  el.innerHTML=`<div class="row"><b>Hierarki ${TREES[id]}</b><span class="noprint actions"><button onclick="setTree(true)">Buka semua</button> <button onclick="setTree(false)">Tutup semua</button></span></div><div style="margin-top:8px;overflow-x:auto">${html}</div>`;
  const root=document.querySelector('.domain-module-root[data-module="'+id+'"]')||$('#view');
  const heading=root&&root.querySelector('.row');
  if(heading)heading.insertAdjacentElement('afterend',el);
}
function setTree(o){$$('#tree details').forEach(d=>d.open=o)}
function filtered(id){
  const cols=FIELDS[id]||STD, q=S.q.toLowerCase();
  const rows = dbAll(id).filter(r=>(!['program','kegiatan','subkegiatan'].includes(id)||!RENJA_WORKSPACE_ID||String(r.renjaRef||'')===String(RENJA_WORKSPACE_ID))&&(!S.st||r.status===S.st)&&(!q||cols.some(([k,,ty,opt])=>{
    let value=r[k]??'';
    if(ty==='rel'&&value){const target=dbAll(opt).find(x=>String(x.id)===String(value));if(target)value=[target.nama,target.kode].filter(Boolean).join(' ')}
    if(ty==='hit')value=exportFieldValue(id,r,cols.find(c=>c[0]===k)||[k,'',ty,opt]);
    if(ty==='turunan')value=turunanText(opt,r.id);
    return String(value).toLowerCase().includes(q);
  })));
  // Urutkan master Komisi dan Fraksi berdasarkan kode secara natural (K-1, K-2, K-10; F-01, F-02, ...).
  // Jangan bergantung pada urutan baris yang dikembalikan database karena SELECT tanpa ORDER BY tidak menjamin urutan.
  if(id==='komisi'||id==='fraksi'){
    rows.sort((a,b)=>String(a.kode||'').localeCompare(String(b.kode||''),'id',{numeric:true,sensitivity:'base'}) || String(a.nama||'').localeCompare(String(b.nama||''),'id',{numeric:true,sensitivity:'base'}));
  }
  return rows;
}
const TABLE_COLS={anggota:8,alat:7,'keanggotaan-akd':6}; // Kolom jabatan Anggota DPRD dan seluruh kolom AKD ditampilkan.
function drawTable(id){
  if(PLAN_TABLES[id])return drawPlanTable(id);

/* ============ TABEL TUJUAN & SASARAN (RPJMD Tabel 3.5 · Renstra PD Tabel 3.3) ============
   Satu record = satu baris tabel (Tujuan atau Sasaran). Sasaran menunjuk ke Tujuan lewat field "induk".
   Tampilan disusun ulang sebagai matriks sesuai format dokumen; input lewat formulir cepat atau langsung di sel. */
const PLAN_YEARS=[2025,2026,2027,2028,2029,2030];
const PLAN_TABLES={
  rpjmd:{title:'Tabel 3.5 Teknik Merumuskan Tujuan dan Sasaran RPJMD',col1:'VISI/<br>MISI',head:'#cfe2f5'},
  renstra:{title:'Tabel 3.3 Teknik Merumuskan Tujuan dan Sasaran Renstra PD',col1:'NSPK DAN<br>SASARAN RPJMD<br>YANG RELEVAN',head:'#e6e8ec'}
};
const PLAN_EDIT={rpjmd:false,renstra:false};
const planCmp=(a,b)=>String(a.kode||'').localeCompare(String(b.kode||''),'id',{numeric:true,sensitivity:'base'});
const planIsS=r=>r.jenis==='Sasaran';
function planGroups(id){
  const all=dbAll(id), vis=new Set(filtered(id).map(r=>r.id));
  const tujuan=all.filter(r=>!planIsS(r)).sort(planCmp), groups=[];
  tujuan.forEach(t=>{
    const kids=all.filter(r=>planIsS(r)&&String(r.induk)===String(t.id)).sort(planCmp);
    const rows=[t,...kids].filter(r=>vis.has(r.id));
    if(rows.length)groups.push({t,rows});
  });
  const known=new Set(tujuan.map(t=>String(t.id)));
  const orphan=all.filter(r=>planIsS(r)&&!known.has(String(r.induk))&&vis.has(r.id)).sort(planCmp);
  if(orphan.length)groups.push({t:null,rows:orphan});
  return groups;
}
function planNextKode(t,jenis,indukId){
  const all=dbAll(t);
  if(jenis!=='Sasaran'){
    const n=all.filter(r=>!planIsS(r)).map(r=>parseInt(String(r.kode||'').replace(/\D/g,''),10)||0);
    return 'T'+(Math.max(0,...n)+1);
  }
  const p=all.find(r=>String(r.id)===String(indukId));
  if(!p)return 'S';
  const pn=String(p.kode||'').replace(/^\D+/,'')||'1';
  const n=all.filter(r=>planIsS(r)&&String(r.induk)===String(p.id)).map(r=>parseInt(String(r.kode||'').split('.').pop(),10)||0);
  return 'S'+pn+'.'+(Math.max(0,...n)+1);
}
function planRefLabel(r){return [r.kode,r.nama].filter(Boolean).join(' — ')}
function planHeadHtml(id){
  const c=PLAN_TABLES[id], bg=c.head;
  const th=(txt,extra='')=>`<th ${extra} style="background:${bg};color:#10233f">${txt}</th>`;
  return `<thead>
  <tr>${th(c.col1,'rowspan="2"')}${th('TUJUAN','rowspan="2"')}${th('SASARAN','rowspan="2"')}${th('INDIKATOR','rowspan="2"')}${th('TARGET TAHUN','colspan="6"')}${th('KET.','rowspan="2"')}<th class="noprint" rowspan="2" style="background:${bg};color:#10233f">AKSI</th></tr>
  <tr>${PLAN_YEARS.map(y=>th(y)).join('')}</tr>
  <tr class="plan-num">${Array.from({length:11},(_,i)=>`<td>(${i+1})</td>`).join('')}<td class="noprint"></td></tr></thead>`;
}
function planTableHtml(id,edit,printMode){
  const groups=planGroups(id), canW=canWrite(id)&&!printMode, ed=edit&&canW;
  const inp=(row,f,val,cls='',ph='')=>`<input class="${cls}" data-pf="${f}" data-id="${esc(row.id)}" value="${esc(val)}" placeholder="${esc(ph)}">`;
  const ta=(row,f,val,ph='')=>`<textarea rows="2" data-pf="${f}" data-id="${esc(row.id)}" placeholder="${esc(ph)}">${esc(val)}</textarea>`;
  const body=groups.map(g=>{
    return g.rows.map((r,i)=>{
      const S=planIsS(r);
      let c1='';
      if(i===0){
        const t=g.t;
        let inner;
        if(!t)inner='<span class="sub">Sasaran tanpa Tujuan induk</span>';
        else if(id==='rpjmd')inner=ed?ta(t,'visimisi',t.visimisi,'Visi / Misi'):esc(t.visimisi||'');
        else{
          const ref=dbAll('rpjmd').find(x=>String(x.id)===String(t.rpjmdRef));
          const opts=dbAll('rpjmd').filter(x=>planIsS(x)).sort(planCmp);
          inner=ed
            ? ta(t,'nspk',t.nspk,'NSPK')+`<select data-pf="rpjmdRef" data-id="${esc(t.id)}" style="margin-top:4px"><option value="">— Sasaran RPJMD —</option>${opts.map(o=>`<option value="${esc(o.id)}" ${String(o.id)===String(t.rpjmdRef)?'selected':''}>${esc(planRefLabel(o))}</option>`).join('')}</select>`
            : `${esc(t.nspk||'')}${ref?`<div class="plan-ref">Sasaran RPJMD: ${esc(planRefLabel(ref))}</div>`:''}`;
        }
        c1=`<td rowspan="${g.rows.length}" class="plan-c1">${inner}</td>`;
      }
      const label=ed
        ? `<div class="plan-kode">${inp(r,'kode',r.kode,'plan-k')}</div>${ta(r,'nama',r.nama,S?'Uraian sasaran':'Uraian tujuan')}`
        : `<b>${esc(r.kode||'')}</b>${r.nama?`<div>${esc(r.nama)}</div>`:''}`;
      const cT=S?'<td></td>':`<td class="plan-t">${label}</td>`;
      const cS=S?`<td class="plan-t">${label}</td>`:'<td></td>';
      const cI=`<td>${ed?ta(r,'indikator',r.indikator,'Indikator'):esc(r.indikator||'')}</td>`;
      const cY=PLAN_YEARS.map(y=>`<td class="plan-y">${ed?inp(r,'t'+y,r['t'+y],'plan-yi'):esc(r['t'+y]??'')}</td>`).join('');
      const cK=`<td>${ed?ta(r,'keterangan',r.keterangan):esc(r.keterangan||'')}</td>`;
      const act=printMode?'':`<td class="noprint actions plan-act">${canW?`<button onclick="openForm('${id}','${esc(r.id)}')">Ubah</button>${S?'':` <button onclick="openForm('${id}',null,{jenis:'Sasaran',induk:'${esc(r.id)}'})">+ Sasaran</button>`}`:''}${canDeleteRecord(id)?` <button class="btn-d" onclick="delRow('${id}','${esc(r.id)}')">Hapus</button>`:''}</td>`;
      return `<tr class="${S?'plan-s':'plan-tj'}">${c1}${cT}${cS}${cI}${cY}${cK}${act}</tr>`;
    }).join('');
  }).join('');
  const empty=`<tr><td colspan="${printMode?11:12}" class="plan-empty">Belum ada data. Klik <b>+ Tujuan</b> untuk mulai mengisi, lalu <b>+ Sasaran</b> pada setiap Tujuan.</td></tr>`;
  return `<table class="plan-tbl" data-plan="${id}">${planHeadHtml(id)}<tbody>${body||empty}</tbody></table>`;
}
function drawPlanTable(id){
  const c=PLAN_TABLES[id], ed=PLAN_EDIT[id]&&canWrite(id), box=$('#tbl');
  if(!box)return;
  box.style.border='none';
  box.innerHTML=`<div class="plan-bar noprint">
    ${canWrite(id)?`<button class="btn-p" id="planAddT">+ Tujuan</button>
    <button id="planMode" class="${ed?'btn-p':''}">${ed?'✔ Selesai input cepat':'✎ Input cepat di tabel'}</button>`:''}
    <span class="hint">${ed?'Ketik langsung di sel. Data tersimpan otomatis saat berpindah sel (Tab). Gunakan + Sasaran untuk menambah baris sasaran.':'Satu baris = satu Tujuan/Sasaran. Klik Ubah untuk formulir lengkap, atau Input cepat untuk mengisi langsung di tabel.'}</span></div>
  <div class="plan-title">${esc(c.title)}</div>
  <div style="overflow:auto">${planTableHtml(id,ed,false)}</div>`;
  const add=$('#planAddT'); if(add)add.onclick=()=>openForm(id,null);
  const md=$('#planMode'); if(md)md.onclick=()=>{PLAN_EDIT[id]=!PLAN_EDIT[id];drawPlanTable(id)};

    const el=e.target.closest('[data-pf]'); if(!el)return;
    const f=el.dataset.pf, rid=el.dataset.id, val=el.value.trim();

      }

function canManageMembership(groupType){
  // Penempatan anggota adalah data sumber di modul Anggota DPRD, tetapi tombol
  // lepas penempatan juga menjadi kewenangan pengelola modul kelompok terkait.
  // RLS Supabase tetap menjadi lapisan otorisasi akhir untuk operasi cloud.
  return ['komisi','fraksi'].includes(groupType) && (canWrite('anggota') || canWrite(groupType));
}

function refreshMembershipSurface(groupType){if(location.hash.slice(1)==='kelembagaan')renderKelembagaan(groupType);else renderModule(groupType)}

    <div class="full hint" style="padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)">Pilih nama dari kolom Nama pada modul Anggota DPRD. Formulir ini hanya menetapkan penempatan dan peran; tidak membuat ulang data anggota.</div>
    ${candidates.length?`<label class="full">Nama Anggota DPRD<select name="memberId" required><option value="">— pilih nama anggota —</option>${options}</select></label>`:`<div class="full empty">Tidak ada nama Anggota DPRD yang tersedia untuk ditambahkan. Periksa atau tambahkan data di modul Anggota DPRD terlebih dahulu.</div>`}

    <div class="full" id="memberPickerError" style="display:none;color:var(--bad);padding:8px 10px;border:1px solid rgba(240,68,56,.35);background:rgba(240,68,56,.06);border-radius:8px"></div>
    <div class="full row" style="margin-top:6px"><span class="hint">Nama diambil dari data induk Anggota DPRD.</span><span><button type="button" onclick="closeM()">Batal</button> <button class="btn-p" type="submit" ${candidates.length?'':'disabled'}>Simpan penempatan</button></span></div>
  </form>`;
  $('#ov').classList.add('show');
  $('#memberPickerForm').onsubmit=async e=>{
    e.preventDefault();

    if(!member){showError('Pilih nama anggota DPRD yang valid.');return}

      const oldGroup=dbAll(groupType).find(g=>String(g.id)===oldId);

      if(!confirm(`${member.nama} saat ini sudah ditempatkan pada ${label.toLowerCase()} "${oldName}".\n\nJika dilanjutkan, penempatan akan dipindahkan ke "${groupName}". Data induk anggota dan penempatan pada jenis kelompok lain tidak dihapus.\n\nLanjutkan?`))return;
    }

    const index=list.findIndex(m=>String(m.id)===String(member.id));

    }catch(error){
      if(submit)submit.disabled=false;
